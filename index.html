    }).join('') + '</div>' +
    '<div class="book-toolbar fade-in delay-2">' +
      '<label class="search-box">' + icon('search') + '<input id="wordSearch" type="search" placeholder="搜单词或中文释义" value="' + esc(searchState.q) + '"></label>' +
      '<div class="filter-tabs">' +
        [['all', '全部'], ['new', '未学'], ['learning', '学习中'], ['due', '待复习'], ['scheduled', '已排期']].map(function (f) {
          return '<button class="' + (searchState.filter === f[0] ? 'on' : '') + '" data-filter="' + f[0] + '">' + f[1] + '</button>';
        }).join('') + '</div>' +
      '<span class="faint" style="font-size:10px;margin-left:auto">共 ' + book.words.length + ' 词 · 已学 ' + learned + ' · 待复习 ' + due + '</span>' +
    '</div>' +
    '<div id="wordTable" class="fade-in delay-2">' + wordRows() + '</div>';
  }

  /* ---------- memory ---------- */
  function renderMemory() {
    const now = Date.now();
    const cards = learnedCards();
    const avgS = E.averageStability(cards);
    const ret = E.predictedRetention(cards, now);
    const risk = cards.map(function (c) { return { c: c, r: E.cardRetrievability(c, now) }; }).sort(function (a, b) { return a.r - b.r; });
    const counts = [0, 0, 0, 0, 0, 0, 0];
    cards.forEach(function (c) { counts[E.bucketOf(c.stability)]++; });
    const maxB = Math.max.apply(null, counts.concat([1]));
    const curve = aggregateCurve(cards, 30);
    const due = dueCards(now).length;
    return '' +
    '<div class="page-head fade-in"><div><div class="eyebrow">MEMORY</div><h1>记忆曲线</h1><p>每个词都有自己的遗忘速度。持久度越高，下一次复习就排得越远。</p></div>' +
      '<a class="btn" href="#science">' + icon('flask') + '它是怎么算的</a></div>' +
    '<div class="stats-grid fade-in delay-1">' +
      bigStat('已进入记忆', cards.length, '个词', '至少学习过一次') +
      bigStat('平均持久度', avgS ? E.humanInterval(avgS) : '—', '', 'R 降到 90% 所需时间') +
      bigStat('此刻保留率', ret ? Math.round(ret * 100) + '%' : '—', '', '所有已学词的平均值') +
      bigStat('待复习', due, '个', '已越过遗忘临界点') +
    '</div>' +
    '<div class="memory-grid fade-in delay-2">' +
      '<section class="card curve-panel">' +
        '<div class="chart-head"><div><h3>未来 30 天 · 平均保留率</h3><p>不复习的话，记忆会这样下滑</p></div><span class="pill">' + (cards.length ? cards.length + ' 个词' : '示意曲线') + '</span></div>' +
        '<div class="curve-wrap">' + curveChart(curve, { height: 260, marker: 7, markerY: curve[Math.round(curve.length * 7 / 30) - 1] ? curve[Math.round(curve.length * 7 / 30) - 1][1] : 0.9, markerLabel: '第 7 天', label: '未来三十天平均记忆保留率' }) + '</div>' +
        '<div class="curve-note"><span>现在 <b>' + Math.round((curve[0] ? curve[0][1] : 0) * 100) + '%</b></span><span>第 7 天 <b>' + Math.round((curve[Math.round(curve.length * 7 / 30)] ? curve[Math.round(curve.length * 7 / 30)][1] : 0) * 100) + '%</b></span><span>第 30 天 <b>' + Math.round((curve[curve.length - 1] ? curve[curve.length - 1][1] : 0) * 100) + '%</b></span><span style="margin-left:auto">每次复习都会把曲线重新拉回顶部</span></div>' +
      '</section>' +
      '<section class="card card-pad">' +
        '<div class="chart-head"><div><h3>持久度分布</h3><p>大多词能撑多久</p></div><span class="pill gray">' + cards.length + ' 词</span></div>' +
        '<div class="bucket-grid">' + E.BUCKETS.map(function (b, i) {
          return '<div class="bucket"><div class="bucket-bar"><i style="height:' + Math.max(3, Math.round(counts[i] / maxB * 92)) + 'px;background:' + b.color + '"></i></div><b>' + counts[i] + '</b><span>' + b.label + '</span></div>';
        }).join('') + '</div>' +
        '<div class="divider"></div>' +
        '<div class="row between"><span class="faint" style="font-size:10px">最稳的词</span><span style="font-family:var(--serif);font-size:16px">' + (cards.length ? esc(wordOf(cards.slice().sort(function (a, b) { return b.stability - a.stability; })[0].key).w) : '—') + '</span></div>' +
        '<div class="row between" style="margin-top:8px"><span class="faint" style="font-size:10px">最脆的词</span><span style="font-family:var(--serif);font-size:16px">' + (risk.length ? esc(wordOf(risk[0].c.key).w) : '—') + '</span></div>' +
      '</section>' +
    '</div>' +
    '<div class="memory-grid fade-in delay-3" style="margin-top:16px">' +
      '<section class="card card-pad">' +
        '<div class="row between"><div><h3 class="serif" style="font-size:19px">记忆最浅的词</h3><p class="faint" style="font-size:11px;margin-top:2px">可提取概率低于 92% 的词优先出现在这里</p></div><span class="pill cinnabar">' + risk.filter(function (x) { return x.r < 0.92; }).length + ' 个</span></div>' +
        '<div class="risk-list" style="margin-top:8px">' + (risk.length ? risk.slice(0, 9).map(function (x) {
          const w = wordOf(x.c.key);
          return '<div class="risk-item" data-key="' + esc(x.c.key) + '"><span class="risk-word">' + esc(w.w) + '</span><span class="risk-def">' + esc(w.t[0]) + '</span><span class="risk-val' + (x.r >= 0.9 ? ' ok' : '') + '">' + Math.round(x.r * 100) + '%</span></div>';
        }).join('') : '<div class="empty" style="padding:24px 0"><p>还没有已学单词。先去学第一组。</p></div>') + '</div>' +
      '</section>' +
      '<section class="card card-pad">' +
        '<div class="chart-head"><div><h3>接下来 14 天</h3><p>复习会落在哪几天</p></div></div>' +
        '<div class="bars" style="height:150px;margin-top:12px;padding-bottom:22px">' + E.forecast(cards, 14, now).map(function (n, i) {
          const max = Math.max.apply(null, E.forecast(cards, 14, now).concat([1]));
          const d = addDays(new Date(), i);
          return '<div class="bar-col' + (i === 0 ? ' today' : '') + (n ? '' : ' zero') + '"><div class="bar-fill" style="height:' + (n ? Math.max(5, n / max * 96) : 3) + 'px"></div><span class="bar-label">' + (i === 0 ? '今' : (d.getMonth() + 1) + '/' + d.getDate()) + '</span></div>';
        }).join('') + '</div>' +
        '<div class="chart-legend" style="margin-top:8px"><span><i style="background:var(--jade)"></i>到期词数</span><span style="margin-left:auto">复习越分散，越轻松</span></div>' +
      '</section>' +
    '</div>';
  }
  function bigStat(label, value, suffix, delta) {
    return '<div class="card big-stat"><div class="label">' + label + '</div><div class="value">' + value + (suffix ? '<small>' + suffix + '</small>' : '') + '</div><div class="delta">' + delta + '</div></div>';
  }

  /* ---------- stats ---------- */
  function renderStats() {
    const now = Date.now();
    const st = streakInfo();
    const days = Object.keys(state.stats.days);
    const totalReviews = state.stats.totalReviews || 0;
    const studiedDays = days.filter(function (k) { return state.stats.days[k].total > 0; }).length;
    const last30 = [];
    for (let i = 29; i >= 0; i--) {
      const k = dayKey(addDays(new Date(), -i));
      last30.push(state.stats.days[k] || { total: 0, new: 0, g1: 0, g2: 0, g3: 0, ms: 0 });
    }
    const rev30 = last30.reduce(function (a, d) { return a + d.total; }, 0);
    const good30 = last30.reduce(function (a, d) { return a + d.g2 + d.g3; }, 0);
    const acc30 = rev30 ? Math.round(good30 / rev30 * 100) : 0;
    const mins = Math.round((state.stats.totalTime || 0) / 60000);
    const maxDay = Math.max.apply(null, days.map(function (k) { return state.stats.days[k].total || 0; }).concat([1]));
    return '' +
    '<div class="page-head fade-in"><div><div class="eyebrow">PROGRESS</div><h1>学习数据</h1><p>不是看你背了多少，而是看记忆留下了多少。</p></div>' +
      '<button class="btn" data-action="export-data">' + icon('download') + '导出备份</button></div>' +
    '<div class="stats-grid fade-in delay-1">' +
      bigStat('累计复习', totalReviews, '次', '每一次都算数') +
      bigStat('学习天数', studiedDays, '天', '当前连续 ' + st.current + ' 天') +
      bigStat('近 30 天记住率', acc30 + '%', '', '模糊也算记住') +
      bigStat('专注时长', mins < 60 ? mins : (mins / 60).toFixed(1), mins < 60 ? '分钟' : '小时', '按实际停留估算') +
    '</div>' +
    '<div class="heat-card card fade-in delay-2">' +
      '<div class="row between"><div><h3 class="serif" style="font-size:19px">学习热力图</h3><p class="faint" style="font-size:11px;margin-top:2px">最近 20 周，颜色越深，复习越多</p></div><span class="pill">' + st.days + ' 个学习日</span></div>' +
      heatmap(140) +
      '<div class="heat-legend"><span>少</span><i class="heat-cell"></i><i class="heat-cell l1"></i><i class="heat-cell l2"></i><i class="heat-cell l3"></i><i class="heat-cell l4"></i><span>多</span></div>' +
    '</div>' +
    '<div class="dash-grid fade-in delay-3" style="margin-top:16px">' +
      '<section class="card card-pad">' +
        '<div class="row between"><h3 class="serif" style="font-size:19px">最近的复习</h3><a class="text-link" href="#books">去词库' + icon('chevron') + '</a></div>' +
        '<div class="log-table">' + ((state.stats.activity || []).length ? state.stats.activity.slice(0, 12).map(function (a) {
          const w = wordOf(a.key);
          return '<div class="log-row" data-key="' + esc(a.key) + '"><span class="log-date">' + fmtDate(a.t) + '</span><span class="log-main"><b>' + esc(w.w) + '</b><span>' + esc(w.t[0]) + '</span></span><span><span class="log-pill log-' + (a.g === 1 ? 'again' : a.g === 2 ? 'hard' : 'good') + '">' + (a.g === 1 ? '忘记' : a.g === 2 ? '模糊' : '认识') + '</span></span><span class="faint" style="font-size:9px;text-align:right">' + (a.g === 1 ? '重新学' : '已排期') + '</span></div>';
        }).join('') : '<div class="empty" style="padding:26px 0"><p>还没有复习记录。</p></div>') + '</div>' +
      '</section>' +
      '<section class="card card-pad">' +
        '<h3 class="serif" style="font-size:19px">学习节奏</h3><p class="faint" style="font-size:11px;margin-top:2px">每天复习量的分布</p>' +
        '<div class="bars" style="height:160px;margin-top:14px;padding-bottom:22px">' + last30.slice(-14).map(function (d, i) {
          const n = d.total || 0;
          return '<div class="bar-col' + (n ? '' : ' zero') + '"><div class="bar-fill" style="height:' + (n ? Math.max(5, n / maxDay * 100) : 3) + 'px"></div><span class="bar-label">' + (i % 3 === 0 ? '+' + (14 - i) : '') + '</span></div>';
        }).join('') + '</div>' +
        '<div class="curve-note"><span>近 14 天 <b>' + last30.slice(-14).reduce(function (a, d) { return a + (d.total || 0); }, 0) + '</b> 次复习</span><span style="margin-left:auto">连续 <b>' + st.current + '</b> 天</span></div>' +
      '</section>' +
    '</div>';
  }
  function heatmap(days) {
    const end = new Date(); end.setHours(12, 0, 0, 0);
    const start = addDays(end, -(days - 1));
    while (start.getDay() !== 1) start.setDate(start.getDate() - 1);
    let cells = '';
    let d = new Date(start);
    while (d <= end) {
      const k = dayKey(d);
      const n = state.stats.days[k] ? state.stats.days[k].total || 0 : 0;
      const lv = n === 0 ? '' : n < 10 ? 'l1' : n < 20 ? 'l2' : n < 40 ? 'l3' : 'l4';
      cells += '<i class="heat-cell ' + lv + (k === today() ? ' today' : '') + '" title="' + k + ' · ' + n + ' 次复习"></i>';
      d = addDays(d, 1);
    }
    return '<div class="heatmap">' + cells + '</div>';
  }

  /* ---------- science ---------- */
  let sim = { s: 8, retention: 0.9 };
  function simCurve() {
    const days = Math.max(20, Math.round(sim.s * 2.4));
    const pts = [];
    for (let i = 0; i <= 40; i++) { const t = days * i / 40; pts.push([t, E.retrievability(t, sim.s)]); }
    return { pts: pts, days: days };
  }
  function renderScience() {
    const simData = simCurve();
    const interval = E.intervalForRetention(sim.s, sim.retention);
    return '' +
    '<div class="sci-hero fade-in">' +
      '<div class="eyebrow">THE MECHANISM</div>' +
      '<h1>不是“第 1 / 2 / 4 / 7 天”，<br>是每一次都重新计算。</h1>' +
      '<p>墨墨公开的 MM 算法资料里，核心是把记忆拆成三个量：可提取概率 R、记忆持久度 S、单词难度 D。墨墨开源的 FSRS 系列把这套思路完整公开。墨忆用 FSRS-6 做调度内核，复刻产品层：每日学习量、复习优先、记忆持久度、遗忘曲线。</p>' +
    '</div>' +
    '<div class="sci-grid fade-in delay-1">' +
      sciFactor('01', 'R', '可提取概率', '此刻想起来的概率。刚复习完接近 100%，随着时间按幂函数下滑。', 'R(t,S) = (1 + factor · t/S)^(−decay)') +
      sciFactor('02', 'S', '记忆持久度', 'R 降到 90% 所需的天数。S 越高，忘得越慢，下一次间隔越长。', 'S′ = S · (1 + Δ)') +
      sciFactor('03', 'D', '单词难度', '这个词对你有多难。D 越高，同样复习一次带来的 S 增长越小。', 'D ∈ [1, 10]') +
    '</div>' +
    '<div class="sci-two fade-in delay-2">' +
      '<section class="card sci-card">' +
        '<h2>一次评分，改变了什么</h2>' +
        '<p>你按下“认识 / 模糊 / 忘记”时，算法不会简单地加一天。它先算出<b>此刻的 R</b>，再根据这次表现更新 S 和 D，最后解出“R 再次降到目标保留率”是哪一天。</p>' +
        '<div class="formula-block"><span class="dim">// 复习成功时，持久度的增长</span><br>S′ = S · (1 + e<sup>w₈</sup> · (11−D) · S<sup>−w₉</sup> · (e<sup>w₁₀(1−R)</sup> − 1) · hard)<br><br><span class="dim">// 忘记时，持久度会回退</span><br>S′ = w₁₁ · D<sup>−w₁₂</sup> · ((S+1)<sup>w₁₃</sup> − 1) · e<sup>w₁₄(1−R)</sup><br><br><span class="dim">// 下一次复习间隔（目标保留率 r）</span><br><span class="hl">I = S / factor · (r<sup>−1/decay</sup> − 1)</span></div>' +
        '<h3>三个反直觉的地方</h3>' +
        '<ul>' +
          '<li><b>越晚复习，复习后反而越牢。</b>间隔效应：在快忘的时候想起来，S 增长更大。</li>' +
          '<li><b>越难的词，增长越慢。</b>同样的“认识”，难词的 S 增量更小，间隔更短。</li>' +
          '<li><b>目标保留率不是越高越好。</b>90% 意味着用更少的复习换住大部分记忆；95% 更稳，但复习量会明显上升。</li>' +
        '</ul>' +
        '<h3>为什么不是固定周期</h3>' +
        '<p>艾宾浩斯本人没有发明“1/2/4/7/15 天记忆法”。那些数字只是他实验里的采样时间点，不是复习时机。真正有效的间隔，取决于这个词对你有多难、你已经记了多久、以及你上次是什么时候见的。</p>' +
      '</section>' +
      '<aside class="card sci-card">' +
        '<h2>亲手算一次</h2><p>拖动持久度，看看下一次复习会被排到哪天。</p>' +
        '<div class="sim-box">' +
          '<div class="sim-row"><span>记忆持久度 S</span><output id="simSVal">' + sim.s.toFixed(0) + ' 天</output></div>' +
          '<input type="range" min="1" max="60" step="1" value="' + sim.s + '" data-sim="s" style="width:100%">' +
          '<div class="sim-row" style="margin-top:16px"><span>目标保留率</span><output id="simRVal">' + Math.round(sim.retention * 100) + '%</output></div>' +
          '<input type="range" min="80" max="97" step="1" value="' + Math.round(sim.retention * 100) + '" data-sim="r" style="width:100%">' +
          '<div class="divider"></div>' +
          '<div class="row between"><span class="faint" style="font-size:10px">下一次复习</span><b class="serif" style="font-size:24px;color:var(--jade)" id="simInterval">' + E.humanInterval(interval) + '</b></div>' +
          '<div class="faint" style="font-size:9.5px;margin-top:5px" id="simExplain">R 从 100% 降到 ' + Math.round(sim.retention * 100) + '% 时再见。</div>' +
          '<div style="margin-top:12px" id="simChart">' + curveChart(simData.pts, { height: 180, marker: interval, markerY: sim.retention, markerLabel: E.humanInterval(interval), xTicks: [0, Math.round(simData.days / 2), simData.days] }) + '</div>' +
        '</div>' +
        '<div class="kbd-row"><span class="key">1</span> 忘记 <span class="key">2</span> 模糊 <span class="key">3</span> 认识</div>' +
        '<div class="divider"></div>' +
        '<h3 style="margin-top:0">参考</h3>' +
        '<div class="source-list">' +
          '<a href="http://memodocs.maimemo.com/docs/algorithm-intro" target="_blank" rel="noopener">' + icon('arrow') + '墨墨记忆算法官方文档 · MM / FSRS</a>' +
          '<a href="https://github.com/open-spaced-repetition/awesome-fsrs/wiki/The-Algorithm" target="_blank" rel="noopener">' + icon('arrow') + 'FSRS-6 公式与默认参数（开源）</a>' +
          '<a href="http://memodocs.maimemo.com/docs/ebbinghaus_schedule" target="_blank" rel="noopener">' + icon('arrow') + '墨墨：艾宾浩斯记忆法是假的</a>' +
        '</div>' +
      '</aside>' +
    '</div>' +
    '<div class="card sci-card fade-in delay-3" style="margin-top:16px">' +
      '<div class="row between"><div><h2>算法演进时间线</h2><p>从“熟知度矩阵”到“记忆动力学 + 随机最短路”。</p></div><span class="pill">2015 → 现在</span></div>' +
      '<div class="timeline">' +
        [['2015', 'MM-0', '提出“熟知度” FM 与记忆矩阵，记录每次反馈后的下一次间隔。'],
         ['2016', 'MM-1', '单词难度排名 WDR：不同难度的词，首次复习间隔不同。'],
         ['2021', 'MM-2 / MM-3', '遗忘曲线监控 FCM；用割线法解决数据稀疏，为前 8 次反馈搜索最优间隔。'],
         ['2022', 'SSP-MMC', 'ACM SIGKDD：把复习规划形式化为随机最短路，求期望耗时最少的策略。'],
         ['2022–23', 'MM-4 / MM-4.2', '引入记忆召回等级 MRL，把用户记忆能力映射进 BMMS 空间。'],

         ['现在', 'MM-5', '官方更新日志仍标注 Coming soon，尚未公开细节。'],
         ['现在', 'FSRS-6', '开源社区持续迭代的 21 参数模型，墨忆的调度内核。']].map(function (x) {
          return '<div class="tl-item"><div class="tl-date">' + x[0] + '</div><div class="tl-line"><span class="tl-dot"></span><span class="tl-bar"></span></div><div class="tl-text"><b>' + x[1] + '</b>' + x[2] + '</div></div>';
        }).join('') +
      '</div>' +
    '</div>';
  }
  function sciFactor(n, letter, name, desc, formula) {
    return '<article class="card sci-factor"><div class="num">' + n + '</div><h3>' + letter + '<span>' + name + '</span></h3><p>' + desc + '</p><div class="formula">' + formula + '</div></article>';
  }

  /* ---------- settings ---------- */
  function renderSettings() {
    const s = state.settings;
    return '' +
    '<div class="page-head fade-in"><div><div class="eyebrow">PREFERENCES</div><h1>设置</h1><p>你的学习节奏，应该由你决定。所有数据只保存在这台设备。</p></div><span class="pill">v1.0 · 离线</span></div>' +
    '<div class="settings-grid fade-in delay-1">' +

  function setRange(label, desc, key, value, min, max, step, unit) {
    return '<div class="set-row"><div class="set-info"><h4>' + label + '</h4><p>' + desc + '</p></div><div class="set-control range-wrap"><input type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + value + '" data-setting="' + key + '"><span class="range-val" id="val-' + key + '">' + value + unit + '</span></div></div>';

  /* ---------- placeholder renderers ---------- */
  function render() {
    const route = currentRoute();
    renderChrome();
    const view = $('#view');
    if (route === 'today') view.innerHTML = renderToday();
    else if (route === 'books') view.innerHTML = renderBooks();
    else if (route === 'memory') view.innerHTML = renderMemory();
    else if (route === 'stats') view.innerHTML = renderStats();
    else if (route === 'science') view.innerHTML = renderScience();
    else if (route === 'settings') view.innerHTML = renderSettings();

    void view.offsetWidth;
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });

  /* ============================================================
     Study session
     ============================================================ */
  let session = null;
  let onb = null;

  function itemForCard(c) { return { key: c.key, kind: c.state === 'relearning' ? 'relearn' : 'review' }; }
  function itemForWord(w) { return { key: w.w.toLowerCase(), kind: 'new' }; }

  function buildQueue(reviews, newWords) {
    const out = [];
    let i = 0, j = 0;
    while (i < reviews.length || j < newWords.length) {
      for (let k = 0; k < 2 && i < reviews.length; k++) out.push(itemForCard(reviews[i++]));
      if (j < newWords.length) out.push(itemForWord(newWords[j++]));
      if (i >= reviews.length) {
        while (j < newWords.length) out.push(itemForWord(newWords[j++]));
      }
    }
    return out;
  }

  function startSession(kind) {
    const now = Date.now();
    const p = plan(now);
    let reviews = [], news = [];
    if (kind === 'ahead') {
      reviews = learnedCards().slice().sort(function (a, b) { return a.dueAt - b.dueAt; }).slice(0, 30);
    } else if (kind === 'extra') {
      news = bookUnlearned(activeBook()).slice(0, 10);
    } else {
      reviews = p.dueBatch.slice();
      news = p.newWords.slice();
    }
    if (!reviews.length && !news.length) {
      toast('今天没有待学内容了，去词库逛逛吧');
      return;
    }
    const queue = buildQueue(reviews, news);
    ensureGoal(queue.length);
    const unique = new Set(queue.map(function (x) { return x.key; }));
    session = {
      queue: queue, total: unique.size, completed: new Set(),
      reviewed: 0, grades: { 1: 0, 2: 0, 3: 0 }, newCount: 0,
      startedAt: now, lastAction: now, revealed: false, hint: false, imageHint: false,
      done: false, kind: kind || 'plan'
    };
    document.body.style.overflow = 'hidden';
    renderStudy();
  }

  function startSingle(key) {
    const c = cardOf(key);
    const queue = [{ key: String(key).toLowerCase(), kind: !c || !c.reps ? 'new' : c.state === 'relearning' ? 'relearn' : 'review' }];
    session = {
      queue: queue, total: 1, completed: new Set(),
      reviewed: 0, grades: { 1: 0, 2: 0, 3: 0 }, newCount: 0,
      startedAt: Date.now(), lastAction: Date.now(), revealed: true, hint: false, imageHint: false,
      done: false, kind: 'single'
    };
    document.body.style.overflow = 'hidden';
    renderStudy();
  }

  function closeStudy() {
    $('#studyRoot').innerHTML = '';
    document.body.style.overflow = '';
    session = null;
    render();
  }

  function revealStudy() {
    if (!session || !session.queue.length) return;
    session.revealed = true;
    session.hint = false;
    const key = session.queue[0].key;
    renderStudy();
    if (state.settings.autoSpeak) speak(wordOf(key).w);
  }

  function rateStudy(g) {
    if (!session || !session.queue.length) return;
    const now = Date.now();
    const item = session.queue[0];
    const key = item.key;
    const card = ensureCard(key, now);
    const wasNew = !card.reps;
    const next = E.gradeCard(card, g, now, state.settings.retention);
    state.cards[key] = next;

    const ds = dayStat(now);
    ds.total = (ds.total || 0) + 1;
    ds['g' + g] = (ds['g' + g] || 0) + 1;
    if (wasNew) ds.new = (ds.new || 0) + 1;
    ds.ms = (ds.ms || 0) + Math.min(90000, now - session.lastAction);
    state.stats.totalReviews = (state.stats.totalReviews || 0) + 1;
    state.stats.totalTime = (state.stats.totalTime || 0) + Math.min(90000, now - session.lastAction);
    state.stats.activity.unshift({ t: now, key: key, g: g, book: state.settings.bookId });
    if (state.stats.activity.length > 200) state.stats.activity.length = 200;

    session.reviewed += 1;
    session.grades[g] += 1;
    if (wasNew) session.newCount += 1;
    session.lastAction = now;
    session.queue.shift();

    if (g === 1 || next.state === 'learning') {
      const already = session.queue.some(function (x) { return x.key === key; });
      if (!already) {
        const at = Math.min(3, session.queue.length);
        session.queue.splice(at, 0, { key: key, kind: 'relearn' });
      }
      toast('先放回队列 · ' + E.humanInterval(next.interval) + '后再见');
    } else {
      session.completed.add(key);
      toast('下次复习 · <b>' + E.humanInterval(next.interval) + '</b>后');
    }
    session.revealed = false;
    session.hint = false;
    session.imageHint = false;
    save();

    if (!session.queue.length) {
      finishSession();
    } else {
      renderStudy();
    }
  }

  function skipStudy() {
    if (!session || session.queue.length < 2) { toast('这是最后一张了，评一下再走'); return; }
    session.queue.push(session.queue.shift());
    session.revealed = false;
    session.hint = false;
    session.imageHint = false;
    renderStudy();
  }

  function finishSession() {
    session.done = true;
    saveNow();
    confetti();
    renderSummary();
  }

  function studyTag(kind) {
    if (kind === 'new') return '新词 · NEW';
    if (kind === 'relearn') return '重学 · RELEARN';
    return '复习 · REVIEW';
  }

  function renderStudy() {
    if (!session) return;
    if (session.done) return;
    if (!session.queue.length) { finishSession(); return; }
    const now = Date.now();
    const item = session.queue[0];
    const card = cardOf(item.key) || E.newCard(item.key, now);
    const word = wordOf(item.key);
    const isNew = !card.reps;
    const kind = isNew ? 'new' : (card.state === 'relearning' ? 'relearn' : item.kind === 'relearn' ? 'relearn' : 'review');
    const done = session.completed.size;
    const pct = Math.min(100, Math.round(done / Math.max(1, session.total) * 100));
    const preview = E.preview(card, now, state.settings.retention);
    const defs = word.t || [];
    const ex = CURATED[item.key] || {};
    const note = card.note || '';
    const mn = note || ex.mn || '';
    const visual = visualOf(item.key);
    const hasVisual = visual.type !== 'none';
    const tagClass = kind === 'new' ? '' : kind === 'relearn' ? ' relearn' : ' review';
    const exampleHint = ex.ex ? '<div class="study-ex" style="margin-top:20px"><div class="study-ex-label"><span>例句提示</span>' + speakButton(ex.ex) + '</div><div class="study-ex-en">' + highlightWord(ex.ex, word.w, true) + '</div><div class="study-ex-zh">' + esc(ex.exZh || '') + '</div></div>' : '';
    const front = '' +
      '<div class="study-card">' +
        '<div class="study-card-top"><span class="study-tag' + tagClass + '">' + studyTag(kind) + '</span>' +
          '<div class="study-hint-actions">' +
            (hasVisual ? '<button class="study-hint-btn" data-action="visual-hint">' + icon('image') + (session.imageHint ? '收起图片' : '看图提示') + '</button>' : '') +
            (ex.ex ? '<button class="study-hint-btn" data-action="hint">' + icon('spark') + (session.hint ? '收起例句' : '例句提示') + '</button>' : '') +
          '</div>' +
        '</div>' +
        '<div class="study-word">' + esc(word.w) + '</div>' +
        '<div class="study-phone-row"><span class="study-phone">' + esc(word.p || '') + '</span><button class="speak-btn" data-action="speak" data-word="' + esc(word.w) + '" title="朗读">' + icon('volume') + '</button></div>' +
        (session.imageHint ? '<div class="study-visual">' + visualFrame(item.key, true) + '<div class="study-visual-cap">' + visualCaption(item.key) + '</div></div>' : '') +
        (session.hint ? exampleHint : '') +
        '<div class="study-front-note">' + icon('info') + '先在心里说出意思，再翻开。想起来，才算认识。</div>' +
        '<div class="study-reveal-hint"><span class="key">空格</span> 翻开释义 <span style="margin-left:auto">' + (isNew ? '第一次见' : '已复习 ' + card.reps + ' 次') + '</span></div>' +
      '</div>';
    const back = '' +
      '<div class="study-card study-back">' +
        '<div class="study-card-top"><span class="study-tag' + tagClass + '">' + studyTag(kind) + '</span><span class="faint" style="font-size:9px">' + (isNew ? '建立第一条记忆' : '持久度 ' + E.humanInterval(card.stability)) + '</span></div>' +
        '<div class="study-word" style="font-size:clamp(36px,5.5vw,52px);margin-top:18px">' + esc(word.w) + '</div>' +
        '<div class="study-phone-row"><span class="study-phone">' + esc(word.p || '') + '</span><button class="speak-btn" data-action="speak" data-word="' + esc(word.w) + '" title="朗读">' + icon('volume') + '</button></div>' +
        '<div class="study-defs">' + defs.map(function (t) {
          const m = String(t).match(/^([a-z]+\.)\s*(.*)$/i);
          return '<div class="study-def">' + (m ? '<span class="pos">' + esc(m[1]) + '</span>' + esc(m[2]) : esc(t)) + '</div>';
        }).join('') + '</div>' +
        (hasVisual ? '<div class="study-visual">' + visualFrame(item.key, true) + '<div class="study-visual-cap">' + visualCaption(item.key) + '</div></div>' : '') +
        (ex.ex ? '<div class="study-ex"><div class="study-ex-label"><span>例句</span>' + speakButton(ex.ex) + '</div><div class="study-ex-en">' + highlightWord(ex.ex, word.w) + '</div><div class="study-ex-zh">' + esc(ex.exZh || '') + '</div></div>' : '') +
        (mn ? '<div class="study-mn"><span class="mn-mark">记</span><span>' + esc(mn) + '</span></div>' : '') +
        '<div class="study-meta">' +
          (card.reps ? '<span>持久度 <b>' + E.humanInterval(card.stability) + '</b></span><span>难度 <b>' + card.difficulty.toFixed(1) + '</b></span><span>已复习 <b>' + card.reps + '</b> 次</span>' : '<span>首次学习 · 先建立记忆</span>') +
        '</div>' +
      '</div>';
    const rating = session.revealed
      ? '<div class="rating-title">这次记得怎么样？</div><div class="rating-buttons">' +
          '<button class="rate-btn rate-again" data-action="rate" data-grade="1"><span class="key">1</span><b>忘记</b><small>' + preview[0].label + ' 后</small></button>' +
          '<button class="rate-btn rate-hard" data-action="rate" data-grade="2"><span class="key">2</span><b>模糊</b><small>' + preview[1].label + ' 后</small></button>' +
          '<button class="rate-btn rate-good" data-action="rate" data-grade="3"><span class="key">3</span><b>认识</b><small>' + preview[2].label + ' 后</small></button>' +
        '</div><div class="rating-skip"><button data-action="skip">暂时跳过</button></div>'
      : '<button class="btn btn-primary btn-lg" style="width:100%" data-action="reveal">翻开释义 <span class="key" style="margin-left:6px">Space</span></button><div class="rating-skip"><button data-action="skip">暂时跳过</button></div>';

    $('#studyRoot').innerHTML = '<div class="study-screen">' +
      '<div class="study-top"><button class="icon-btn" data-action="close-study" title="结束学习">' + icon('close') + '</button>' +
        '<div class="study-progress"><div class="study-progress-meta"><span>本轮进度 <b>' + done + ' / ' + session.total + '</b></span><span>' + (session.kind === 'ahead' ? '提前复习' : session.kind === 'extra' ? '加练新词' : '今日计划') + '</span></div><div class="study-progress-track"><div class="study-progress-fill" style="width:' + pct + '%"></div></div></div>' +
        '<div class="study-count">' + (isNew ? '新词' : '复习') + ' · ' + (card.reps || 0) + '</div></div>' +
      '<div class="study-main"><div class="study-card-wrap">' + (session.revealed ? back : front) + '</div></div>' +
      '<div class="rating-bar"><div class="rating-inner">' + rating + '</div></div>' +
    '</div>';
  }

  function highlightWord(text, word, blank) {
    let out = esc(text);
    const safe = esc(word).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    try {
      const re = new RegExp('\\b' + safe + '(s|es|ed|ing|d)?\\b', 'ig');
      out = out.replace(re, function (m) { return blank ? '<span style="letter-spacing:.12em;color:var(--cinnabar)">＿＿＿＿</span>' : '<em>' + m + '</em>'; });
    } catch (e) { /* ignore */ }
    return out;
  }

  function renderSummary() {
    const s = session;
    if (!s) return;
    const secs = Math.max(1, Math.round((Date.now() - s.startedAt) / 1000));
    const timeVal = secs < 60 ? secs : Math.round(secs / 60);
    const timeUnit = secs < 60 ? '秒' : '分';
    const acc = s.reviewed ? Math.round((s.grades[2] + s.grades[3]) / s.reviewed * 100) : 0;
    const learned = learnedCards();
    const now = Date.now();
    const next = learned.filter(function (c) { return c.dueAt > now; }).sort(function (a, b) { return a.dueAt - b.dueAt; })[0];
    const overdue = learned.filter(function (c) { return c.dueAt <= now; }).length;
    $('#studyRoot').innerHTML = '<div class="study-screen"><div class="study-top"><button class="icon-btn" data-action="close-study">' + icon('close') + '</button><div class="study-progress"><div class="study-progress-meta"><span>本轮完成</span><span>' + s.reviewed + ' 次评分</span></div><div class="study-progress-track"><div class="study-progress-fill" style="width:100%"></div></div></div><div class="study-count">DONE</div></div>' +
      '<div class="study-main"><div class="summary-wrap">' +
        '<div class="summary-mark">' + icon('check') + '</div>' +
        '<h1>这一轮，记完了。</h1>' +
        '<p>' + (s.newCount ? '新认识 ' + s.newCount + ' 个词，' : '') + '记忆曲线已经重新算过。' + (acc >= 80 ? '状态不错。' : '别急，模糊也是记忆的一部分。') + '</p>' +
        '<div class="summary-stats">' +
          '<div class="summary-stat"><span>评分次数</span><b>' + s.reviewed + '</b></div>' +
          '<div class="summary-stat"><span>记住率</span><b>' + acc + '%</b></div>' +
          '<div class="summary-stat"><span>本轮用时</span><b>' + timeVal + '<small style="font-size:9px;color:var(--faint)"> ' + timeUnit + '</small></b></div>' +
          '<div class="summary-stat"><span>新词</span><b>' + s.newCount + '</b></div>' +
        '</div>' +
        '<div class="summary-next"><h3>下一次再见</h3><p>' + (next ? '最近一个到期词在 <b>' + dueLabel(next.dueAt) + '</b>。今天可以合上了。' : overdue ? '还有 <b>' + overdue + '</b> 个词已经到期，想继续的话可以现在复习。' : '还没有排期。明天打开时，计划会自动生成。') + '</p></div>' +
        '<div class="summary-actions"><button class="btn btn-primary" data-action="close-study">回到今日</button>' +
          (bookUnlearned(activeBook()).length ? '<button class="btn" data-action="start-session" data-kind="extra">再学 10 个新词</button>' : '') +
          (learned.length ? '<button class="btn" data-action="start-session" data-kind="ahead">提前复习</button>' : '') +
        '</div>' +
      '</div></div></div>';
    document.body.style.overflow = 'hidden';
  }

  function confetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const colors = ['#2f6f5e', '#c4553b', '#bd8a3c', '#6f9a78', '#e5dcc7'];
    for (let i = 0; i < 26; i++) {
      const el = document.createElement('i');
      el.className = 'confetti';
      el.style.left = (42 + Math.random() * 16) + '%';
      el.style.top = (34 + Math.random() * 10) + '%';
      el.style.background = colors[i % colors.length];
      el.style.setProperty('--dx', (Math.random() * 300 - 150) + 'px');
      el.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      el.style.animationDelay = (Math.random() * .18) + 's';
      document.body.appendChild(el);
      setTimeout(function () { el.remove(); }, 1800);
    }
  }

     Onboarding
     ============================================================ */
  function renderOnboarding() {
    if (!onb) {
      onb = {
        bookId: bookMap[state.settings.bookId] ? state.settings.bookId : BOOKS[0].id,
        dailyTotal: state.settings.dailyTotal || 60,
        dailyNew: state.settings.dailyNew || 20,

      };
    }
    const root = $('#onboardingRoot');
    root.innerHTML = '<div class="onboard"><div class="onboard-card">' +
      '<div class="onboard-art"><span class="brand-mark">' + icon('logo', '') + '</span>' +

  function finishOnboarding() {
    state.settings.bookId = onb.bookId;
    state.settings.dailyTotal = onb.dailyTotal;
    state.settings.dailyNew = onb.dailyNew;
    state.settings.retention = onb.retention / 100;
    state.settings.onboarded = true;
    saveNow();
    $('#onboardingRoot').innerHTML = '';
    onb = null;
    render();
    const n = plan().newWords.length;
    toast('计划已生成 · 今天先见 ' + n + ' 个新词');
  }

  /* ============================================================
     Word detail
     ============================================================ */
  function openWordDetail(key) {
    const k = String(key).toLowerCase();
    const w = wordOf(k);
    const c = cardOf(k);
    const now = Date.now();
    const ex = CURATED[k] || {};
    const mn = (c && c.note) || ex.mn || '';
    const st = statusInfo(c, now);
    const r = c && c.reps ? E.cardRetrievability(c, now) : null;
    const curve = perWordCurve(c || E.newCard(k, now), 30);
    const hist = c && c.history ? c.history.slice(-6).reverse() : [];
    const interval = c && c.reps ? E.humanInterval(c.stability) : '—';
    const due = c && c.reps ? (c.dueAt <= now ? '现在' : dueLabel(c.dueAt, now)) : '未安排';
    openModal(
      '<div class="modal-head"><div class="word-detail-head"><div><div class="word-detail-word">' + esc(w.w) + '</div><div class="word-detail-phone">' + esc(w.p || '') + '</div></div>' +
        '<div class="word-detail-actions"><button class="icon-btn" data-action="speak" data-word="' + esc(w.w) + '" style="border:1px solid var(--line);background:var(--surface-2)">' + icon('volume') + '</button>' +
        '<button class="icon-btn" data-action="review-now" data-key="' + esc(k) + '" style="border:1px solid var(--line);background:var(--surface-2)" title="现在复习">' + icon('play') + '</button></div></div>' +
        '<button class="modal-close" data-action="close-modal">' + icon('close') + '</button></div>' +
      '<div class="modal-body"><div class="row wrap" style="gap:6px;margin-top:4px"><span class="status-pill status-' + st.key + '">' + st.text + '</span>' +
        (c && c.reps ? '<span class="pill gray">持久度 ' + E.humanInterval(c.stability) + '</span><span class="pill gray">难度 ' + c.difficulty.toFixed(1) + '</span><span class="pill ' + (c.dueAt <= now ? 'cinnabar' : '') + '">' + due + '</span>' : '<span class="pill">尚未学习</span>') + '</div>' +
        '<div class="detail-defs">' + (w.t || []).map(function (t) { return '<div class="detail-def">' + esc(t) + '</div>'; }).join('') + '</div>' +
        '<div class="detail-block visual-detail"><div class="visual-head"><h4>图像记忆</h4><div class="visual-actions">' +
          '<button class="btn btn-sm" data-action="pick-image" data-key="' + esc(k) + '">' + icon('image') + (visualOf(k).type === 'image' ? ' 换一张' : ' 上传图片') + '</button>' +
          (visualOf(k).type === 'image' ? '<button class="icon-btn" data-action="remove-image" data-key="' + esc(k) + '" title="移除配图">' + icon('close') + '</button>' : '') +
        '</div></div>' + visualFrame(k) + '<div class="visual-caption">' + visualCaption(k) + '</div></div>' +
        (ex.ex ? '<div class="detail-block"><div class="detail-head"><h4>例句</h4>' + speakButton(ex.ex) + '</div><div class="detail-ex">' + highlightWord(ex.ex, w.w) + '</div><div class="detail-ex-zh">' + esc(ex.exZh || '') + '</div></div>' : '') +
        (mn ? '<div class="detail-block"><h4>记忆钩子</h4><div class="detail-mn">' + esc(mn) + '</div></div>' : '') +
        '<div class="memory-strip">' +
          '<div class="mem-cell"><span>可提取概率</span><b>' + (r == null ? '—' : Math.round(r * 100)) + '<small>' + (r == null ? '' : '%') + '</small></b></div>' +
          '<div class="mem-cell"><span>记忆持久度</span><b>' + (c && c.reps ? E.humanInterval(c.stability).replace(/ (天|个月|年)$/, '') : '—') + '<small>' + (c && c.reps ? (E.humanInterval(c.stability).match(/天|个月|年/) || [''])[0] : '') + '</small></b></div>' +
          '<div class="mem-cell"><span>下次复习</span><b style="font-size:14px;margin-top:7px">' + due + '</b></div>' +
          '<div class="mem-cell"><span>累计复习</span><b>' + (c ? c.reps : 0) + '<small>次</small></b></div>' +
        '</div>' +
        '<div class="detail-block"><h4>这个词的遗忘曲线</h4><div class="detail-curve">' + curveChart(curve, { height: 190, marker: c && c.reps ? Math.max(1, (c.dueAt - now) / DAY) : null, markerY: state.settings.retention, markerLabel: c && c.reps ? '下次复习' : '', xTicks: [0, 10, 20, 30] }) + '</div></div>' +
        (hist.length ? '<div class="detail-block"><h4>最近反馈</h4><div class="row wrap" style="gap:6px">' + hist.map(function (h) {
          return '<span class="log-pill log-' + (h.g === 1 ? 'again' : h.g === 2 ? 'hard' : 'good') + '">' + fmtDate(h.at) + ' · ' + (h.g === 1 ? '忘记' : h.g === 2 ? '模糊' : '认识') + '</span>';
        }).join('') + '</div></div>' : '') +
        '<div class="detail-block"><h4>我的助记</h4><div class="note-editor"><input id="noteInput" value="' + esc((c && c.note) || '') + '" placeholder="写一句只有你懂的联想…"><button class="btn btn-sm" data-action="save-note" data-key="' + esc(k) + '">保存</button></div></div>' +
      '</div>', true
    );
  }

  function saveNote(key) {
    const input = $('#noteInput');
    if (!input) return;
    const c = ensureCard(key, Date.now());
    c.note = input.value.trim();
    saveNow();
    toast('助记已保存');
  }

  /* ============================================================
     Data actions
     ============================================================ */
  function exportData() {
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'moyi-backup-' + dayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('备份已导出 · ' + Math.round(data.length / 1024) + ' KB');
  }

  function seedDemo() {
    const now = Date.now();
    const book = activeBook();
    const cards = {};
    const pool = book.words.slice(0, Math.min(220, book.words.length));
    pool.forEach(function (w, i) {
      const key = w.w.toLowerCase();
      const reps = 2 + Math.floor(Math.random() * 10);
      const stability = 1 + Math.random() * 70;
      const last = now - Math.floor(1 + Math.random() * Math.min(25, stability * 1.8)) * DAY;
      const due = now + Math.floor((Math.random() - 0.58) * 18) * DAY + Math.floor(Math.random() * 8) * 3600000;
      const c = E.newCard(key, now - (25 + Math.floor(Math.random() * 80)) * DAY);
      c.reps = reps;
      c.lapses = Math.floor(Math.random() * 3);
      c.state = 'review';
      c.stability = stability;
      c.difficulty = 3 + Math.random() * 5.5;
      c.lastReview = last;
      c.dueAt = due;
      c.interval = stability;
      c.history = [];
      for (let h = 0; h < Math.min(5, reps); h++) {
        c.history.push({ at: last - (h + 1) * Math.floor(2 + Math.random() * 10) * DAY, g: 2 + Math.floor(Math.random() * 2), interval: stability, stability: stability * .7, difficulty: c.difficulty, state: 'review', elapsed: 2 });
      }
      cards[key] = c;
    });
    const days = {};
    let totalReviews = 0, totalTime = 0;
    for (let i = 29; i >= 0; i--) {
      if (i > 0 && Math.random() < 0.12) continue;
      const k = dayKey(addDays(new Date(), -i));
      const total = 12 + Math.floor(Math.random() * 44);
      const g1 = Math.floor(total * (.04 + Math.random() * .12));
      const g2 = Math.floor(total * (.12 + Math.random() * .16));
      const g3 = total - g1 - g2;
      days[k] = { total: total, new: i < 12 ? 5 + Math.floor(Math.random() * 12) : 0, g1: g1, g2: g2, g3: g3, ms: total * 38000 };
      totalReviews += total;
      totalTime += total * 38000;
    }
    const activity = [];
    for (let i = 0; i < 40; i++) {
      const w = pool[Math.floor(Math.random() * pool.length)];
      activity.push({ t: now - i * 3600000 * 2 - Math.floor(Math.random() * 3600000), key: w.w.toLowerCase(), g: 1 + Math.floor(Math.random() * 3), book: book.id });
    }
    state.cards = cards;
    state.stats = { days: days, activity: activity, totalReviews: totalReviews, totalTime: totalTime };
    state.settings.onboarded = true;
    saveNow();
    toast('演示数据已载入，正在刷新…');
    setTimeout(function () { location.reload(); }, 700);
  }

  function importFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed !== 'object' || !parsed.cards) throw new Error('bad');
        pendingImport = parsed;
        confirmBox({
          eyebrow: '导入备份', title: '覆盖当前进度？',
          body: '备份里有 <b>' + Object.keys(parsed.cards || {}).length + '</b> 个词的学习记录。导入后，当前数据会被替换。',
          confirm: '导入并覆盖', action: 'confirm-import'
        });
      } catch (e) { toast('这个文件不是有效的墨忆备份'); }
    };
    reader.readAsText(file);
  }
  let pendingImport = null;

  /* ============================================================
     Global events
     ============================================================ */
  function setTheme(theme) {
    state.settings.theme = theme;
    document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#141917' : '#f5f1e7');
    save();
    renderChrome();
  }

  function applySetting(key, value) {
    if (key === 'bookId') {
      if (!bookMap[value]) return;
      state.settings.bookId = value;
      searchState = { q: '', filter: 'all', limit: 60 };
    } else if (key === 'retention') {
      state.settings.retention = clamp(Number(value) / 100, 0.8, 0.97);
    } else if (key === 'dailyTotal') {
      state.settings.dailyTotal = clamp(Math.round(Number(value)), 20, 200);
    } else if (key === 'dailyNew') {
      state.settings.dailyNew = clamp(Math.round(Number(value)), 5, 80);
    } else if (key === 'accent') {
      state.settings.accent = value === 'uk' ? 'uk' : 'us';
    } else if (key === 'autoSpeak') {
      state.settings.autoSpeak = !!value;
    } else if (key === 'themeDark') {
      state.settings.theme = value ? 'dark' : 'light';
      document.documentElement.dataset.theme = state.settings.theme;
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', value ? '#141917' : '#f5f1e7');
      renderChrome();
    }
    save();
  }

  function onClick(e) {
    const routeEl = e.target.closest('[data-route]');
    if (routeEl) {
      e.preventDefault();
      navigate(routeEl.dataset.route);
      return;
    }
    const actionEl = e.target.closest('[data-action]');
    if (actionEl) {
      const action = actionEl.dataset.action;
      if (action === 'start-session') { startSession(actionEl.dataset.kind || 'plan'); return; }
      if (action === 'close-study') { closeStudy(); return; }
      if (action === 'reveal') { revealStudy(); return; }
      if (action === 'rate') { rateStudy(Number(actionEl.dataset.grade)); return; }
      if (action === 'skip') { skipStudy(); return; }
      if (action === 'hint') { if (session) { session.hint = !session.hint; renderStudy(); } return; }
      if (action === 'visual-hint') { if (session) { session.imageHint = !session.imageHint; renderStudy(); } return; }
      if (action === 'pick-image') { pickImage(actionEl.dataset.key); return; }
      if (action === 'remove-image') { removeImage(actionEl.dataset.key); return; }
      if (action === 'close-modal') { closeModal(); return; }
      if (action === 'speak') { e.stopPropagation(); speak(actionEl.dataset.word); return; }
      if (action === 'speak-example') { e.stopPropagation(); speak(actionEl.dataset.text, { rate: 0.92 }); return; }
      if (action === 'review-now') { const k = actionEl.dataset.key; closeModal(); startSingle(k); return; }
      if (action === 'save-note') { saveNote(actionEl.dataset.key); return; }
      if (action === 'switch-book') {
        applySetting('bookId', actionEl.dataset.book);
        render();
        toast('已切换到「' + activeBook().name + '」');
        return;
      }
      if (action === 'more-words') { searchState.limit += 60; refreshWordTable(); return; }
      if (action === 'export-data') { exportData(); return; }
      if (action === 'import-data') { const f = $('#importFile'); if (f) f.click(); return; }
      if (action === 'demo-data') {
        confirmBox({ eyebrow: '演示模式', title: '载入一组演示数据？', body: '会覆盖当前学习记录，用来看完整的图表效果。建议先导出备份。', confirm: '载入演示数据', action: 'confirm-demo' });
        return;
      }
      if (action === 'confirm-demo') { closeModal(); seedDemo(); return; }
      if (action === 'reset-data') {
        confirmBox({ eyebrow: '危险操作', title: '清空所有进度？', body: '记忆曲线、学习记录和设置都会被删除。这个动作不可撤销。', confirm: '确认清空', action: 'confirm-reset', danger: true });
        return;
      }
      if (action === 'confirm-reset') { localStorage.removeItem(LS_KEY); location.reload(); return; }
      if (action === 'confirm-import' && pendingImport) {
        const previous = state;
        state = migrate(pendingImport);
        if (!saveNow()) {
          state = previous;
          toast('备份太大，浏览器存不下，先清理一些记录再试');
          return;
        }
        location.reload();
        return;
      }
      if (action === 'finish-onboarding') { finishOnboarding(); return; }
      if (action === 'forecast-30') { navigate('memory'); return; }
    }

    const filterEl = e.target.closest('[data-filter]');
    if (filterEl) {
      searchState.filter = filterEl.dataset.filter;
      searchState.limit = 60;
      $$('.filter-tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.filter === searchState.filter); });
      refreshWordTable();
      return;
    }
    const bookEl = e.target.closest('[data-onb-book]');
    if (bookEl) {
      onb.bookId = bookEl.dataset.onbBook;
      $$('.onboard-book').forEach(function (b) { b.classList.toggle('on', b.dataset.onbBook === onb.bookId); });
      return;
    }
    const segEl = e.target.closest('[data-setting-seg]');
    if (segEl) {
      applySetting(segEl.dataset.settingSeg, segEl.dataset.value);
      $$('[data-setting-seg="' + segEl.dataset.settingSeg + '"]').forEach(function (b) { b.classList.toggle('on', b.dataset.value === segEl.dataset.value); });
      return;
    }
    const sw = e.target.closest('[data-setting-switch]');
    if (sw) {
      const key = sw.dataset.settingSwitch;
      if (key === 'themeDark') { applySetting(key, !sw.classList.contains('on')); sw.classList.toggle('on'); }
      else if (key === 'autoSpeak') { applySetting(key, !sw.classList.contains('on')); sw.classList.toggle('on'); }
      return;
    }
    const row = e.target.closest('[data-key]');
    if (row && !row.closest('.study-screen') && !e.target.closest('[data-action]')) {
      openWordDetail(row.dataset.key);
      return;
    }
    if (e.target.closest('#themeToggle')) {
      setTheme(state.settings.theme === 'dark' ? 'light' : 'dark');
      render();
      return;
    }
    if (e.target.closest('#avatarBtn')) { navigate('settings'); return; }
    if (e.target.closest('#quickSearch')) { navigate('books'); setTimeout(function () { const i = $('#wordSearch'); if (i) i.focus(); }, 80); return; }
    if (e.target.closest('.modal-backdrop') && (!e.target.closest('.modal'))) closeModal();
  }

  function refreshWordTable() {
    const el = $('#wordTable');
    if (el) el.innerHTML = wordRows();
  }

  function onChange(e) {
    const el = e.target;
    if (el.id === 'importFile') { importFile(el.files && el.files[0]); el.value = ''; return; }
    if (el.dataset && el.dataset.setting) {
      if (el.tagName === 'SELECT') {
        applySetting(el.dataset.setting, el.value);
        render();
        return;
      }
      if (el.type === 'range') {
        applySetting(el.dataset.setting, el.value);
        const out = $('#val-' + el.dataset.setting);
        if (out) out.textContent = el.value + (el.dataset.setting === 'retention' ? '%' : ' 词');
        return;
      }
    }
    if (el.dataset && el.dataset.onb) {
      onb[el.dataset.onb] = Number(el.value);
      const out = $('#onb-' + el.dataset.onb);
      if (out) out.textContent = el.value + (el.dataset.onb === 'retention' ? '%' : ' 词');
      return;
    }
    if (el.dataset && el.dataset.sim) {
      if (el.dataset.sim === 's') sim.s = Number(el.value); else sim.retention = Number(el.value) / 100;
      return;
    }
    if (el.id === 'wordSearch') {
      searchState.q = el.value;
      searchState.limit = 60;
      refreshWordTable();
    }
  }

  function onInput(e) {
    const el = e.target;
    if (el.id === 'wordSearch') {
      searchState.q = el.value;
      searchState.limit = 60;
      refreshWordTable();
      return;
    }
    if (el.dataset && el.dataset.setting && el.type === 'range') {
      applySetting(el.dataset.setting, el.value);
      const out = $('#val-' + el.dataset.setting);
      if (out) out.textContent = el.value + (el.dataset.setting === 'retention' ? '%' : ' 词');
      return;
    }
    if (el.dataset && el.dataset.onb) {
      onb[el.dataset.onb] = Number(el.value);
      const out = $('#onb-' + el.dataset.onb);
      if (out) out.textContent = el.value + (el.dataset.onb === 'retention' ? '%' : ' 词');
      return;
    }
    if (el.dataset && el.dataset.sim) {
      const val = Number(el.value);
      if (el.dataset.sim === 's') {
        sim.s = val;
        const out = $('#simSVal'); if (out) out.textContent = val + ' 天';
      } else {
        sim.retention = val / 100;
        const out = $('#simRVal'); if (out) out.textContent = val + '%';
      }
      const interval = E.intervalForRetention(sim.s, sim.retention);
      const out = $('#simInterval'); if (out) out.textContent = E.humanInterval(interval);
      const ex = $('#simExplain'); if (ex) ex.textContent = 'R 从 100% 降到 ' + Math.round(sim.retention * 100) + '% 时再见。';
      const chart = $('#simChart');
      if (chart) {
        const d = Math.max(20, Math.round(sim.s * 2.4));
        const pts = [];
        for (let i = 0; i <= 40; i++) { const t = d * i / 40; pts.push([t, E.retrievability(t, sim.s)]); }
        chart.innerHTML = curveChart(pts, { height: 180, marker: interval, markerY: sim.retention, markerLabel: E.humanInterval(interval), xTicks: [0, Math.round(d / 2), d] });
      }
    }
  }

  function onKey(e) {
    if (e.key === 'Escape') {
      if ($('#modalRoot').innerHTML) { closeModal(); return; }
      if (session) { closeStudy(); return; }
    }
    if (!session || session.done) return;
    if (e.code === 'Space' || e.key === 'Enter') {
      if (!e.target.closest('input,textarea,button')) {
        e.preventDefault();
        if (!session.revealed) revealStudy();
      }
      return;
    }
    if (session.revealed && ['1', '2', '3'].indexOf(e.key) >= 0) {
      if (!e.target.closest('input,textarea')) { e.preventDefault(); rateStudy(Number(e.key)); }
    }
  }

  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', onKey);
  window.addEventListener('hashchange', function () {
    if (session) closeStudy();
    render();
  });
  window.addEventListener('beforeunload', saveNow);

  /* ---------- boot ---------- */
  render();
  if (!state.settings.onboarded) renderOnboarding();

  // expose a few internals for the local test harness
  window.__MOYI = {
    get state() { return state; },
    save: saveNow,
    render: render,
    start: function (kind) { startSession(kind); }
  };
})();
</script>
</body>
