<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e7">
  <meta name="description" content="墨忆 · 基于 FSRS-6 记忆模型的离线背单词应用。把遗忘算准，把复习安排在临界点。">
  <title>墨忆 · 把遗忘算准</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f5e'/%3E%3Cpath d='M6 21c3.6-7 7-9 10.6-6 3.6 3 7 2 10.4-4' fill='none' stroke='%23f5f1e7' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
/* ============================================================
   墨忆 · Moyi — visual system
   Rice paper, ink, jade and a single cinnabar accent.
   ============================================================ */
:root {
  --paper: #f5f1e7;
  --paper-deep: #ece6d8;
  --surface: #fffdf7;
  --surface-2: #faf6ec;
  --ink: #1e2521;
  --ink-soft: #3d4741;
  --muted: #6b746b;
  --faint: #747d73;
  --line: rgba(30, 37, 33, .11);
  --line-strong: rgba(30, 37, 33, .2);
  --jade: #2f6f5e;
  --jade-deep: #1d4e41;
  --jade-soft: #dfeae2;
  --jade-wash: rgba(47, 111, 94, .09);
  --cinnabar: #c4553b;
  --cinnabar-soft: #f3ddd5;
  --amber: #bd8a3c;
  --amber-soft: #f2e6ce;
  --blue: #41637c;
  --shadow-s: 0 1px 2px rgba(35, 32, 24, .04), 0 5px 18px rgba(35, 32, 24, .05);
  --shadow-m: 0 2px 4px rgba(35, 32, 24, .05), 0 18px 50px rgba(35, 32, 24, .09);
  --shadow-l: 0 30px 90px rgba(20, 30, 24, .18);
  --r-s: 10px;
  --r-m: 16px;
  --r-l: 24px;
  --r-xl: 32px;
  --serif: "Iowan Old Style", "Palatino Linotype", "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", "NSimSun", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --sidebar-w: 248px;
  --ease: cubic-bezier(.22, .8, .26, 1);
  color-scheme: light;
}

[data-theme="dark"] {
  --paper: #141917;
  --paper-deep: #101412;
  --surface: #1b211e;
  --surface-2: #202723;
  --ink: #ece9df;
  --ink-soft: #cfcabf;
  --muted: #9ba49b;
  --faint: #717b73;
  --line: rgba(236, 233, 223, .11);
  --line-strong: rgba(236, 233, 223, .22);
  --jade: #79b8a2;
  --jade-deep: #a7d4c1;
  --jade-soft: #243c33;
  --jade-wash: rgba(121, 184, 162, .1);
  --cinnabar: #e58a70;
  --cinnabar-soft: #412a24;
  --amber: #d9b06c;
  --amber-soft: #3a3122;
  --blue: #8eb4cc;
  --shadow-s: 0 1px 2px rgba(0, 0, 0, .2), 0 5px 18px rgba(0, 0, 0, .16);
  --shadow-m: 0 2px 4px rgba(0, 0, 0, .25), 0 18px 50px rgba(0, 0, 0, .3);
  --shadow-l: 0 30px 90px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(900px 480px at 8% -6%, rgba(47, 111, 94, .10), transparent 65%),
    radial-gradient(800px 520px at 105% 12%, rgba(196, 85, 59, .055), transparent 62%),
    radial-gradient(700px 600px at 50% 110%, rgba(189, 138, 60, .05), transparent 65%);
}
[data-theme="dark"] body::before {
  background:
    radial-gradient(900px 480px at 8% -6%, rgba(121, 184, 162, .09), transparent 65%),
    radial-gradient(800px 520px at 105% 12%, rgba(229, 138, 112, .05), transparent 62%);
}
::selection { background: var(--jade); color: var(--surface); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: inherit; }
svg { display: block; }
h1, h2, h3, h4, p { margin: 0; }
.hidden { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* ---------- shell ---------- */
.app-shell {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  min-height: 100vh;
}
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 26px 16px 18px;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, rgba(255, 253, 247, .5), transparent 38%);
  backdrop-filter: blur(6px);
}
[data-theme="dark"] .sidebar { background: linear-gradient(180deg, rgba(27, 33, 30, .6), transparent 38%); }
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 4px 10px 28px;
  user-select: none;
}
.brand-mark {
  width: 38px; height: 38px; flex: none;
  border-radius: 50%;
  background: var(--ink);
  color: var(--paper);
  display: grid; place-items: center;
  position: relative;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14), 0 6px 16px rgba(30, 37, 33, .16);
}
.brand-mark svg { width: 25px; height: 25px; }
.brand-name {
  font-family: var(--serif);
  font-size: 23px;
  letter-spacing: .13em;
  line-height: 1;
  color: var(--ink);
  font-weight: 600;
}
.brand-sub {
  font-size: 9px;
  letter-spacing: .32em;
  color: var(--faint);
  margin-top: 5px;
  font-weight: 600;
}
.nav-label {
  padding: 0 12px 8px;
  font-size: 10px;
  letter-spacing: .18em;
  color: var(--faint);
  font-weight: 600;
}
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 12px;
  border-radius: 11px;
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
  transition: background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease);
  position: relative;
}
.nav-item .ico { width: 18px; height: 18px; opacity: .85; }
.nav-item:hover { background: var(--jade-wash); color: var(--ink); }
.nav-item.active { background: var(--jade-wash); color: var(--jade); font-weight: 600; }
.nav-item.active::before {
  content: "";
  position: absolute; left: -16px; top: 10px; bottom: 10px;
  width: 3px; border-radius: 0 3px 3px 0; background: var(--jade);
}
.nav-item .nav-badge {
  margin-left: auto;
  min-width: 22px; height: 20px; padding: 0 6px;
  border-radius: 20px;
  background: var(--cinnabar); color: #fff;
  font-size: 11px; line-height: 20px; text-align: center; font-weight: 650;
}
.sidebar-spacer { flex: 1; }
.side-streak {
  margin: 16px 4px 14px;
  padding: 15px;
  border-radius: var(--r-m);
  background: linear-gradient(145deg, var(--surface), var(--surface-2));
  border: 1px solid var(--line);
  box-shadow: var(--shadow-s);
}
.side-streak-top { display: flex; align-items: center; gap: 8px; }
.side-streak-top .ico { width: 18px; height: 18px; color: var(--cinnabar); }
.side-streak-num { font-family: var(--serif); font-size: 24px; line-height: 1; font-weight: 600; }
.side-streak-text { font-size: 12px; color: var(--muted); margin-top: 5px; }
.side-week { display: flex; justify-content: space-between; margin-top: 12px; gap: 4px; }
.side-day { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 9px; color: var(--faint); }
.side-dot { width: 17px; height: 17px; border-radius: 50%; background: var(--paper-deep); border: 1px solid var(--line); }
.side-dot.on { background: var(--jade); border-color: var(--jade); box-shadow: 0 0 0 2px var(--jade-wash); }
.side-dot.today { outline: 1px solid var(--cinnabar); outline-offset: 2px; }
.side-foot { padding: 0 12px; font-size: 10px; color: var(--faint); letter-spacing: .03em; }

.main-wrap { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 76px;
  padding: 0 clamp(20px, 4vw, 48px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 1px solid transparent;
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--paper) 86%, transparent);
  backdrop-filter: blur(14px);
}
.topbar-left { display: flex; align-items: baseline; gap: 13px; min-width: 0; }
.page-title { font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: .03em; white-space: nowrap; }
.page-date { font-size: 12px; color: var(--muted); white-space: nowrap; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center;
  color: var(--muted);
  border: 1px solid transparent;
  transition: .18s var(--ease);
  position: relative;
}
.icon-btn:hover { background: var(--surface); color: var(--ink); border-color: var(--line); box-shadow: var(--shadow-s); }
.icon-btn .ico { width: 18px; height: 18px; }
.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--jade-deep); color: var(--paper);
  display: grid; place-items: center;
  font-family: var(--serif); font-size: 15px; font-weight: 600;
  letter-spacing: .04em;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
}
.view { padding: 8px clamp(20px, 4vw, 48px) 70px; max-width: 1380px; width: 100%; margin: 0 auto; min-height: calc(100vh - 76px); }
.mobile-nav { display: none; }

/* ---------- typography / common ---------- */
.eyebrow {
  font-size: 10px; letter-spacing: .2em; font-weight: 650;
  color: var(--jade); text-transform: uppercase;
}
.page-head { margin: 18px 0 26px; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.page-head h1 { font-family: var(--serif); font-size: clamp(28px, 3vw, 38px); font-weight: 600; line-height: 1.15; letter-spacing: .01em; }
.page-head p { color: var(--muted); font-size: 13px; margin-top: 7px; max-width: 520px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 28px 0 14px; }
.section-head h2 { font-family: var(--serif); font-size: 20px; font-weight: 600; }
.section-head .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.text-link { color: var(--jade); font-size: 12px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.text-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.text-link .ico { width: 14px; height: 14px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  box-shadow: var(--shadow-s);
}
.card-pad { padding: 22px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.serif { font-family: var(--serif); }
.mono { font-family: var(--mono); }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  height: 26px; padding: 0 10px; border-radius: 30px;
  font-size: 11px; font-weight: 600; color: var(--jade);
  background: var(--jade-wash); white-space: nowrap;
}
.pill.cinnabar { color: var(--cinnabar); background: var(--cinnabar-soft); }
.pill.amber { color: var(--amber); background: var(--amber-soft); }
.pill.gray { color: var(--muted); background: var(--paper-deep); }
.pill .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 42px; padding: 0 18px;
  border-radius: 11px;
  font-size: 13px; font-weight: 650;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  transition: transform .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease);
  white-space: nowrap;
  text-decoration: none;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-s); }
.btn:active { transform: translateY(0); }
.btn .ico { width: 16px; height: 16px; }
.btn-primary { background: var(--jade-deep); color: #f8f4e9; border-color: transparent; box-shadow: 0 8px 24px rgba(29, 78, 65, .2); }
.btn-primary:hover { background: var(--jade); box-shadow: 0 10px 30px rgba(29, 78, 65, .28); }
.btn-ghost { background: transparent; }
.btn-danger { color: var(--cinnabar); border-color: color-mix(in srgb, var(--cinnabar) 35%, transparent); }
.btn-sm { height: 34px; padding: 0 12px; font-size: 12px; border-radius: 9px; }
.btn-lg { height: 50px; padding: 0 26px; font-size: 14px; border-radius: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

/* ---------- dashboard hero ---------- */
.greeting { margin: 16px 0 22px; }
.greeting h1 { font-family: var(--serif); font-size: clamp(30px, 3.6vw, 46px); font-weight: 600; line-height: 1.12; letter-spacing: .005em; }
.greeting h1 em { font-style: normal; color: var(--jade); position: relative; }
.greeting h1 em::after { content: ""; position: absolute; left: 0; right: 0; bottom: 3px; height: 7px; background: var(--jade-wash); z-index: -1; border-radius: 4px; }
.greeting p { color: var(--muted); margin-top: 9px; font-size: 13.5px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(260px, .8fr); gap: 16px; }
.hero-card {
  position: relative;
  overflow: hidden;
  border-radius: var(--r-xl);
  padding: 28px 30px 26px;
  color: #f4f0e4;
  background:
    radial-gradient(600px 300px at 100% 0%, rgba(128, 191, 166, .28), transparent 65%),
    radial-gradient(500px 400px at 0% 110%, rgba(196, 85, 59, .16), transparent 60%),
    linear-gradient(135deg, #173f35 0%, #235548 55%, #2c6655 100%);
  box-shadow: 0 20px 55px rgba(22, 55, 46, .23);
  isolation: isolate;
}
.hero-card::before {
  content: "";
  position: absolute; inset: 0;
  background-image: radial-gradient(rgba(245, 240, 228, .16) .7px, transparent .7px);
  background-size: 13px 13px;
  opacity: .35;
  mask-image: linear-gradient(100deg, transparent 40%, #000 100%);
  z-index: -1;
}
.hero-card::after {
  content: "";
  position: absolute;
  width: 310px; height: 310px; right: -120px; top: -150px;
  border-radius: 50%;
  border: 1px solid rgba(244, 240, 228, .16);
  box-shadow: 0 0 0 36px rgba(244, 240, 228, .035), 0 0 0 72px rgba(244, 240, 228, .022);
  z-index: -1;
}
.hero-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.hero-kicker { font-size: 10px; letter-spacing: .24em; color: rgba(244, 240, 228, .62); font-weight: 650; }
.hero-title { font-family: var(--serif); font-size: clamp(34px, 4.4vw, 56px); line-height: 1.03; margin-top: 12px; letter-spacing: -.01em; font-weight: 600; }
.hero-title small { font-size: .46em; font-weight: 500; letter-spacing: .04em; color: rgba(244, 240, 228, .65); margin-left: 8px; }
.hero-split { display: flex; gap: 22px; margin-top: 18px; }
.hero-split-item { display: flex; align-items: baseline; gap: 6px; font-size: 12px; color: rgba(244, 240, 228, .7); }
.hero-split-item b { font-family: var(--serif); font-size: 20px; color: #f4f0e4; font-weight: 600; }
.hero-actions { display: flex; gap: 10px; align-items: center; margin-top: 24px; flex-wrap: wrap; }
.hero-actions .btn { border: 0; }
.hero-actions .btn-primary { background: #f4f0e4; color: #173f35; box-shadow: 0 10px 28px rgba(0, 0, 0, .18); }
.hero-actions .btn-primary:hover { background: #fffdf7; }
.hero-actions .btn-ghost { color: rgba(244, 240, 228, .78); border: 1px solid rgba(244, 240, 228, .24); background: transparent; }
.hero-actions .btn-ghost:hover { background: rgba(244, 240, 228, .08); }
.hero-done { display: inline-flex; align-items: center; gap: 7px; color: #cfe3d8; font-size: 12px; margin-top: 15px; }
.hero-done .ico { width: 15px; height: 15px; }
.hero-ring { width: 82px; height: 82px; flex: none; position: relative; }
.hero-ring svg { transform: rotate(-90deg); }
.hero-ring-text { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.hero-ring-text b { font-family: var(--serif); font-size: 22px; line-height: 1; font-weight: 600; }
.hero-ring-text span { display: block; font-size: 8px; letter-spacing: .12em; color: rgba(244,240,228,.55); margin-top: 3px; }

.side-card {
  border-radius: var(--r-xl);
  padding: 22px;
  background: linear-gradient(160deg, var(--surface), var(--surface-2));
  border: 1px solid var(--line);
  box-shadow: var(--shadow-s);
  display: flex; flex-direction: column;
  position: relative; overflow: hidden;
}
.side-card::after {
  content: "";
  position: absolute; width: 160px; height: 160px; right: -70px; bottom: -90px;
  border-radius: 50%; background: var(--jade-wash);
}
.streak-big { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
.flame-badge {
  width: 46px; height: 46px; border-radius: 15px;
  display: grid; place-items: center;
  color: var(--cinnabar);
  background: var(--cinnabar-soft);
  flex: none;
}
.flame-badge .ico { width: 24px; height: 24px; }
.streak-big b { font-family: var(--serif); font-size: 34px; line-height: 1; font-weight: 600; }
.streak-big span { font-size: 11px; color: var(--muted); display: block; margin-top: 4px; }
.week-row { display: flex; justify-content: space-between; gap: 7px; margin-top: 22px; }
.week-cell { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.week-cell span { font-size: 9px; color: var(--faint); }
.week-cell i {
  width: 100%; max-width: 26px; aspect-ratio: 1; border-radius: 9px;
  background: var(--paper-deep); border: 1px solid var(--line);
  display: grid; place-items: center;
  font-style: normal; font-size: 9px; color: transparent;
}
.week-cell i.on { background: var(--jade); border-color: var(--jade); color: #fff; }
.week-cell i.today { outline: 1.5px solid var(--cinnabar); outline-offset: 2px; }
.side-footnote { margin-top: auto; padding-top: 18px; border-top: 1px dashed var(--line); font-size: 11px; color: var(--muted); line-height: 1.6; }
.side-footnote b { color: var(--ink); font-weight: 650; }

.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.stat-card { padding: 17px 18px; border-radius: var(--r-m); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-s); }
.stat-card-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 11px; }
.stat-card-top .ico { width: 15px; height: 15px; color: var(--faint); }
.stat-value { font-family: var(--serif); font-size: 27px; line-height: 1.1; margin-top: 8px; font-weight: 600; letter-spacing: -.01em; }
.stat-value small { font-family: var(--sans); font-size: 10px; color: var(--muted); font-weight: 500; margin-left: 3px; letter-spacing: 0; }
.stat-foot { font-size: 10.5px; color: var(--faint); margin-top: 4px; }

.dash-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, .9fr); gap: 16px; margin-top: 16px; }
.chart-card { padding: 22px 22px 16px; }
.chart-head { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
.chart-head h3 { font-family: var(--serif); font-size: 18px; font-weight: 600; }
.chart-head p { font-size: 11px; color: var(--muted); margin-top: 3px; }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--paper-deep); gap: 2px; }
.seg button { height: 26px; padding: 0 10px; border-radius: 7px; font-size: 10.5px; color: var(--muted); font-weight: 600; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-s); }
.bars { margin-top: 16px; height: 168px; display: flex; align-items: flex-end; gap: 10px; padding-bottom: 24px; position: relative; }
.bars::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: 24px; height: 1px; background: var(--line);
}
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; position: relative; min-width: 0; }
.bar-fill {
  width: 100%; max-width: 34px; border-radius: 7px 7px 3px 3px;
  background: linear-gradient(180deg, var(--jade), color-mix(in srgb, var(--jade) 62%, var(--paper)));
  min-height: 3px; transition: height .5s var(--ease);
  position: relative;
}
.bar-col.today .bar-fill { background: linear-gradient(180deg, var(--cinnabar), color-mix(in srgb, var(--cinnabar) 55%, var(--paper))); }
.bar-col.zero .bar-fill { background: var(--paper-deep); }
.bar-num { font-size: 9px; color: var(--faint); position: absolute; bottom: calc(100% + 4px); white-space: nowrap; }
.bar-label { position: absolute; bottom: 0; font-size: 9.5px; color: var(--faint); white-space: nowrap; }
.bar-col.today .bar-label { color: var(--cinnabar); font-weight: 650; }
.chart-legend { display: flex; gap: 14px; align-items: center; font-size: 10px; color: var(--faint); border-top: 1px solid var(--line); padding-top: 12px; }
.chart-legend i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; margin-right: 4px; }
.dist-list { display: flex; flex-direction: column; gap: 12px; margin-top: 19px; }
.dist-row { display: grid; grid-template-columns: 58px 1fr 30px; gap: 10px; align-items: center; font-size: 10.5px; color: var(--muted); }
.dist-track { height: 7px; background: var(--paper-deep); border-radius: 10px; overflow: hidden; }
.dist-fill { height: 100%; border-radius: 10px; transition: width .5s var(--ease); }
.dist-num { text-align: right; font-family: var(--mono); font-size: 10px; color: var(--faint); }
.donut-wrap { display: flex; align-items: center; gap: 18px; margin-top: 18px; }
.donut { width: 108px; height: 108px; border-radius: 50%; position: relative; flex: none; }
.donut::after { content: ""; position: absolute; inset: 17px; border-radius: 50%; background: var(--surface); }
.donut-center { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; text-align: center; }
.donut-center b { font-family: var(--serif); font-size: 24px; line-height: 1; }
.donut-center span { display: block; font-size: 8px; color: var(--faint); letter-spacing: .08em; margin-top: 3px; }
.donut-legend { display: flex; flex-direction: column; gap: 8px; font-size: 10.5px; color: var(--muted); }
.donut-legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }

.recent-list { display: flex; flex-direction: column; }
.recent-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.recent-item:last-child { border-bottom: 0; }
.recent-word { font-family: var(--serif); font-size: 16px; width: 150px; flex: none; }
.recent-def { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.mini-meter { width: 64px; height: 4px; border-radius: 4px; background: var(--paper-deep); overflow: hidden; flex: none; }
.mini-meter i { display: block; height: 100%; background: var(--jade); border-radius: 4px; }
.recent-r { font-family: var(--mono); font-size: 10px; color: var(--faint); width: 34px; text-align: right; flex: none; }
.quote-card {
  margin-top: 16px; padding: 22px 24px;
  border-radius: var(--r-l);
  background: linear-gradient(135deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line);
  display: flex; gap: 16px; align-items: flex-start;
}
.quote-mark { font-family: var(--serif); font-size: 42px; line-height: .8; color: var(--jade); opacity: .35; }
.quote-text { font-family: var(--serif); font-size: 16px; line-height: 1.7; color: var(--ink-soft); }
.quote-src { font-size: 10px; color: var(--faint); margin-top: 6px; }

/* ---------- empty states ---------- */
.empty { padding: 34px 20px; text-align: center; color: var(--muted); }
.empty .empty-icon { width: 48px; height: 48px; margin: 0 auto 12px; border-radius: 16px; background: var(--jade-wash); color: var(--jade); display: grid; place-items: center; }
.empty .empty-icon .ico { width: 23px; height: 23px; }
.empty h3 { font-family: var(--serif); font-size: 18px; color: var(--ink); font-weight: 600; }
.empty p { font-size: 12px; margin-top: 5px; }

/* ---------- books ---------- */
.book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.book-card {
  padding: 19px;
  border-radius: var(--r-l);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-s);
  position: relative;
  overflow: hidden;
  transition: transform .2s var(--ease), box-shadow .2s var(--ease);
}
.book-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-m); }
.book-card.active { border-color: color-mix(in srgb, var(--jade) 48%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--jade) 25%, transparent), var(--shadow-s); }
.book-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--book-color, var(--jade)); opacity: .8; }
.book-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.book-glyph { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--book-color, var(--jade)) 12%, transparent); color: var(--book-color, var(--jade)); }
.book-glyph .ico { width: 19px; height: 19px; }
.book-card h3 { font-family: var(--serif); font-size: 19px; font-weight: 600; margin-top: 13px; }
.book-card p { font-size: 11px; color: var(--muted); margin-top: 4px; min-height: 34px; }
.book-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--faint); margin-top: 15px; }
.book-progress { height: 5px; border-radius: 5px; background: var(--paper-deep); margin-top: 7px; overflow: hidden; }
.book-progress i { display: block; height: 100%; border-radius: 5px; background: var(--book-color, var(--jade)); }
.book-actions { display: flex; gap: 8px; margin-top: 14px; }
.book-actions .btn { flex: 1; height: 33px; font-size: 11.5px; border-radius: 9px; }
.book-active-tag { position: absolute; top: 15px; right: 15px; font-size: 9px; letter-spacing: .08em; color: var(--jade); font-weight: 700; }

.book-toolbar { display: flex; gap: 10px; align-items: center; margin: 24px 0 14px; flex-wrap: wrap; }
.search-box { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 13px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); min-width: 220px; flex: 1; max-width: 330px; }
.search-box .ico { width: 15px; height: 15px; color: var(--faint); flex: none; }
.search-box input { border: 0; outline: 0; background: transparent; width: 100%; font-size: 12px; }
.filter-tabs { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--paper-deep); }
.filter-tabs button { height: 30px; padding: 0 12px; border-radius: 8px; font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.filter-tabs button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-s); }
.word-table { border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; background: var(--surface); }
.word-row { display: grid; grid-template-columns: minmax(150px, 1.1fr) minmax(0, 2.3fr) 110px 105px 22px; gap: 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s; }
.word-row:last-child { border-bottom: 0; }
.word-row:hover { background: var(--jade-wash); }
.word-head { font-size: 9px; letter-spacing: .12em; color: var(--faint); font-weight: 650; text-transform: uppercase; cursor: default; background: var(--surface-2); }
.word-head:hover { background: var(--surface-2); }
.word-main { min-width: 0; }
.word-main b { font-family: var(--serif); font-size: 16px; font-weight: 600; }
.word-main span { display: block; font-size: 9.5px; color: var(--faint); font-family: var(--mono); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; }
.word-def { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.word-status { font-size: 10px; }
.status-pill { display: inline-flex; padding: 3px 8px; border-radius: 20px; font-size: 9.5px; font-weight: 650; }
.status-new { background: var(--paper-deep); color: var(--muted); }
.status-learning { background: var(--amber-soft); color: var(--amber); }
.status-due { background: var(--cinnabar-soft); color: var(--cinnabar); }
.status-scheduled { background: var(--jade-wash); color: var(--jade); }
.word-due { font-size: 10px; color: var(--faint); }
.word-arrow { color: var(--faint); }
.word-arrow .ico { width: 14px; height: 14px; }
.load-more { width: 100%; height: 44px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
.load-more:hover { background: var(--jade-wash); color: var(--jade); }

/* ---------- memory ---------- */
.memory-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, .9fr); gap: 16px; }
.curve-panel { padding: 22px; }
.curve-wrap { margin-top: 10px; position: relative; }
.curve-wrap svg { width: 100%; height: auto; overflow: visible; }
.curve-axis { font-size: 8px; fill: var(--faint); font-family: var(--sans); }
.curve-label { font-size: 9px; fill: var(--muted); font-family: var(--sans); }
.curve-note { display: flex; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 10px; padding-top: 12px; font-size: 10px; color: var(--faint); }
.curve-note b { color: var(--ink); font-weight: 650; }
.bucket-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 16px; }
.bucket { text-align: center; }
.bucket-bar { height: 96px; display: flex; align-items: flex-end; justify-content: center; }
.bucket-bar i { width: 100%; max-width: 26px; border-radius: 5px 5px 2px 2px; background: var(--bc, var(--jade)); min-height: 3px; opacity: .85; }
.bucket b { display: block; font-family: var(--mono); font-size: 9.5px; color: var(--muted); margin-top: 5px; font-weight: 500; }
.bucket span { display: block; font-size: 8px; color: var(--faint); margin-top: 1px; }
.risk-list { display: flex; flex-direction: column; gap: 2px; margin-top: 7px; }
.risk-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.risk-item:last-child { border-bottom: 0; }
.risk-item:hover .risk-word { color: var(--jade); }
.risk-word { font-family: var(--serif); font-size: 15px; width: 110px; flex: none; transition: color .15s; }
.risk-def { font-size: 10px; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.risk-val { font-family: var(--mono); font-size: 10px; width: 38px; text-align: right; color: var(--cinnabar); }
.risk-val.ok { color: var(--jade); }

/* ---------- stats ---------- */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.big-stat { padding: 19px 20px; }
.big-stat .label { font-size: 10px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; font-weight: 600; }
.big-stat .value { font-family: var(--serif); font-size: 34px; line-height: 1.1; margin-top: 8px; font-weight: 600; }
.big-stat .value small { font-family: var(--sans); font-size: 11px; color: var(--faint); font-weight: 500; margin-left: 4px; }
.big-stat .delta { font-size: 10px; color: var(--faint); margin-top: 5px; }
.heat-card { padding: 22px; margin-top: 16px; }
.heatmap { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); gap: 4px; margin-top: 16px; overflow-x: auto; padding-bottom: 4px; }
.heat-cell { width: 12px; height: 12px; border-radius: 3px; background: var(--paper-deep); border: 1px solid color-mix(in srgb, var(--ink) 4%, transparent); }
.heat-cell.l1 { background: color-mix(in srgb, var(--jade) 22%, var(--paper-deep)); }
.heat-cell.l2 { background: color-mix(in srgb, var(--jade) 40%, var(--paper-deep)); }
.heat-cell.l3 { background: color-mix(in srgb, var(--jade) 62%, var(--paper-deep)); }
.heat-cell.l4 { background: var(--jade); }
.heat-cell.today { outline: 1px solid var(--cinnabar); outline-offset: 1px; }
.heat-legend { display: flex; align-items: center; gap: 5px; font-size: 9px; color: var(--faint); justify-content: flex-end; margin-top: 8px; }
.heat-legend .heat-cell { width: 10px; height: 10px; }
.log-table { margin-top: 12px; }
.log-row { display: grid; grid-template-columns: 88px 1fr 100px 80px; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 11px; align-items: center; }
.log-row:last-child { border-bottom: 0; }
.log-date { color: var(--faint); font-family: var(--mono); font-size: 9.5px; }
.log-main b { font-family: var(--serif); font-size: 14px; font-weight: 600; }
.log-main span { color: var(--faint); font-size: 9.5px; margin-left: 6px; }
.log-pill { font-size: 9px; font-weight: 650; padding: 2px 7px; border-radius: 20px; display: inline-block; }
.log-again { background: var(--cinnabar-soft); color: var(--cinnabar); }
.log-hard { background: var(--amber-soft); color: var(--amber); }
.log-good { background: var(--jade-wash); color: var(--jade); }

/* ---------- settings ---------- */
.settings-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr); gap: 16px; }
.settings-card { padding: 6px 22px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 17px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-info h4 { font-size: 13px; font-weight: 650; }
.set-info p { font-size: 11px; color: var(--muted); margin-top: 3px; max-width: 400px; }
.set-control { flex: none; }
.switch { width: 42px; height: 24px; border-radius: 20px; background: var(--paper-deep); border: 1px solid var(--line); position: relative; transition: .2s; }
.switch::after { content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); top: 2px; left: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.18); transition: .2s var(--ease); }
.switch.on { background: var(--jade); border-color: var(--jade); }
.switch.on::after { left: 20px; }
.range-wrap { display: flex; align-items: center; gap: 12px; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 160px; height: 4px; border-radius: 4px; background: var(--paper-deep); outline: 0; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 17px; height: 17px; border-radius: 50%; background: var(--jade); border: 3px solid var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.2); cursor: pointer; }
.range-val { font-family: var(--mono); font-size: 11px; color: var(--ink); width: 54px; text-align: right; }
.select { height: 36px; padding: 0 30px 0 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size: 5px 5px; background-repeat: no-repeat; }
.seg-setting { display: flex; gap: 4px; padding: 3px; border-radius: 9px; background: var(--paper-deep); }
.seg-setting button { height: 29px; padding: 0 11px; border-radius: 7px; font-size: 10.5px; color: var(--muted); font-weight: 600; }
.seg-setting button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-s); }
.settings-side .card { padding: 20px; }
.about-card { background: linear-gradient(150deg, #1d4e41, #2f6f5e); color: #f2eee2; border: 0; }
.about-card h3 { font-family: var(--serif); font-size: 22px; font-weight: 600; margin-top: 10px; }
.about-card p { font-size: 11px; color: rgba(242, 238, 226, .68); margin-top: 7px; line-height: 1.7; }
.about-card .btn { margin-top: 15px; background: rgba(242, 238, 226, .12); color: #f2eee2; border-color: rgba(242, 238, 226, .2); }
.danger-zone { border-color: color-mix(in srgb, var(--cinnabar) 26%, var(--line)); }
.danger-zone h3 { color: var(--cinnabar); font-size: 14px; }
.danger-zone p { font-size: 11px; color: var(--muted); margin: 5px 0 12px; }

/* ---------- science ---------- */
.sci-hero { padding: 34px; border-radius: var(--r-xl); background: linear-gradient(135deg, #18231f, #264a3e 62%, #2f6f5e); color: #f1ede1; position: relative; overflow: hidden; margin-top: 14px; }
.sci-hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(600px 300px at 85% 0%, rgba(196,85,59,.25), transparent 60%); }
.sci-hero h1 { font-family: var(--serif); font-size: clamp(30px, 4vw, 48px); line-height: 1.15; font-weight: 600; position: relative; z-index: 1; }
.sci-hero p { color: rgba(241, 237, 225, .7); font-size: 13px; max-width: 660px; margin-top: 12px; line-height: 1.8; position: relative; z-index: 1; }
.sci-hero .eyebrow { color: #c9a56d; position: relative; z-index: 1; }
.sci-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }
.sci-factor { padding: 22px; }
.sci-factor .num { font-family: var(--mono); font-size: 10px; color: var(--faint); }
.sci-factor h3 { font-family: var(--serif); font-size: 24px; font-weight: 600; margin-top: 8px; }
.sci-factor h3 span { font-size: 11px; color: var(--muted); font-family: var(--sans); font-weight: 500; margin-left: 4px; }
.sci-factor p { font-size: 11.5px; color: var(--muted); margin-top: 7px; line-height: 1.75; }
.sci-factor .formula { margin-top: 13px; padding: 10px 12px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); font-family: var(--mono); font-size: 11px; color: var(--jade); overflow-x: auto; }
.sci-two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, .85fr); gap: 16px; margin-top: 16px; }
.sci-card { padding: 24px; }
.sci-card h2 { font-family: var(--serif); font-size: 22px; font-weight: 600; }
.sci-card h3 { font-family: var(--serif); font-size: 17px; font-weight: 600; margin-top: 20px; }
.sci-card p { font-size: 12px; color: var(--muted); margin-top: 9px; line-height: 1.8; }
.sci-card ul { margin: 10px 0 0; padding-left: 18px; font-size: 12px; color: var(--muted); line-height: 1.85; }
.sci-card li::marker { color: var(--jade); }
.sci-card b { color: var(--ink); }
.formula-block { margin-top: 14px; padding: 16px 18px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; line-height: 1.9; color: var(--ink-soft); overflow-x: auto; }
.formula-block .hl { color: var(--jade); }
.formula-block .dim { color: var(--faint); }
.timeline { margin-top: 14px; display: flex; flex-direction: column; }
.tl-item { display: grid; grid-template-columns: 72px 12px 1fr; gap: 10px; align-items: flex-start; min-height: 56px; }
.tl-date { font-family: var(--mono); font-size: 10px; color: var(--faint); padding-top: 2px; }
.tl-line { height: 100%; display: flex; flex-direction: column; align-items: center; }
.tl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--jade); margin-top: 4px; flex: none; }
.tl-bar { width: 1px; flex: 1; background: var(--line); }
.tl-item:last-child .tl-bar { display: none; }
.tl-text { padding-bottom: 14px; font-size: 11.5px; color: var(--muted); }
.tl-text b { display: block; color: var(--ink); font-weight: 650; margin-bottom: 2px; }
.sim-box { margin-top: 16px; padding: 18px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.sim-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 11px; color: var(--muted); }
.sim-row output { font-family: var(--mono); color: var(--ink); margin-left: auto; }
.sim-actions { display: flex; gap: 6px; margin-top: 12px; }
.sim-actions button { flex: 1; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 10.5px; font-weight: 600; }
.sim-actions button:hover { border-color: var(--jade); color: var(--jade); }
.source-list { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }
.source-list a { font-size: 11px; color: var(--jade); text-decoration: none; display: flex; gap: 7px; align-items: flex-start; line-height: 1.5; }
.source-list a:hover { text-decoration: underline; text-underline-offset: 3px; }
.source-list .ico { width: 13px; height: 13px; flex: none; margin-top: 2px; }

/* ---------- modal ---------- */
.modal-backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(14, 20, 16, .45); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn .18s ease; }
.modal {
  width: min(720px, 100%); max-height: 88vh; overflow: auto;
  background: var(--surface); border-radius: var(--r-xl);
  box-shadow: var(--shadow-l); border: 1px solid var(--line);
  animation: modalIn .28s var(--ease);
}
.modal.wide { width: min(860px, 100%); }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 24px 26px 0; }
.modal-body { padding: 20px 26px 26px; }
.modal-close { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.modal-close:hover { color: var(--ink); }
.modal-close .ico { width: 15px; height: 15px; }
.word-detail-head { display: flex; align-items: flex-start; gap: 18px; justify-content: space-between; }
.word-detail-word { font-family: var(--serif); font-size: clamp(34px, 5vw, 48px); line-height: 1.1; font-weight: 600; letter-spacing: -.01em; }
.word-detail-phone { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-top: 5px; }
.word-detail-actions { display: flex; gap: 7px; }
.detail-defs { margin-top: 18px; display: flex; flex-direction: column; gap: 7px; }
.detail-def { font-size: 13px; color: var(--ink-soft); line-height: 1.7; padding-left: 15px; position: relative; }
.detail-def::before { content: ""; position: absolute; left: 0; top: 9px; width: 5px; height: 5px; border-radius: 50%; background: var(--jade); opacity: .6; }
.detail-block { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.detail-block h4 { font-size: 9.5px; letter-spacing: .15em; color: var(--faint); font-weight: 650; text-transform: uppercase; margin-bottom: 8px; }
.detail-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.detail-head h4 { margin-bottom: 0; }
.mini-speak {
  display: inline-flex; align-items: center; gap: 4px; flex: none;
  height: 22px; padding: 0 8px; border: 1px solid var(--line); border-radius: 20px;
  background: var(--surface-2); color: var(--jade); font-family: var(--sans);
  font-size: 9.5px; font-weight: 600; letter-spacing: 0; text-transform: none;
  transition: border-color .16s var(--ease), color .16s var(--ease);
}
.mini-speak:hover { border-color: var(--jade); color: var(--ink); }
.mini-speak .ico { width: 11px; height: 11px; }
.detail-ex { font-family: var(--serif); font-size: 16px; line-height: 1.7; color: var(--ink-soft); }
.detail-ex em { font-style: normal; color: var(--jade); border-bottom: 1px solid color-mix(in srgb, var(--jade) 40%, transparent); padding-bottom: 1px; }
.detail-ex-zh { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
.detail-mn { font-size: 12px; color: var(--ink-soft); line-height: 1.8; background: var(--surface-2); border: 1px solid var(--line); padding: 12px 14px; border-radius: 10px; position: relative; }
.detail-mn::before { content: "记"; position: absolute; right: 12px; top: 6px; font-family: var(--serif); font-size: 26px; color: var(--jade); opacity: .12; }

/* 图像记忆卡 */
.visual-detail { margin-top: 20px; }
.visual-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
.visual-head h4 { margin-bottom: 0; }
.visual-actions { display: flex; align-items: center; gap: 6px; }
.visual-actions .btn { padding: 6px 10px; font-size: 10px; }
.visual-actions .icon-btn { width: 28px; height: 28px; border: 1px solid var(--line); background: var(--surface-2); }
.visual-frame {
  min-height: 210px; border: 1px solid var(--line); border-radius: 16px;
  background:
    radial-gradient(320px 180px at 50% 15%, color-mix(in srgb, var(--jade) 7%, transparent), transparent 72%),
    var(--surface-2);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  position: relative;
}
.visual-frame::after {
  content: ""; position: absolute; inset: 10px; border: 1px solid color-mix(in srgb, var(--line-strong) 55%, transparent);
  border-radius: 11px; pointer-events: none;
}
.visual-frame img { display: block; max-width: 100%; max-height: 300px; object-fit: contain; position: relative; z-index: 1; }
.visual-emoji { font-size: clamp(86px, 12vw, 132px); line-height: 1; filter: drop-shadow(0 14px 18px rgba(35, 48, 42, .16)); user-select: none; position: relative; z-index: 1; }
.visual-compact { min-height: 0; }
.visual-compact.visual-frame { width: 108px; height: 92px; flex: none; border-radius: 12px; }
.visual-compact .visual-emoji { font-size: 52px; }
.visual-compact img { max-height: 92px; }
.visual-empty { flex-direction: column; gap: 7px; text-align: center; color: var(--muted); font-size: 11px; line-height: 1.65; border-style: dashed; }
.visual-empty-icon { font-size: 30px; line-height: 1; opacity: .72; }
.visual-caption { margin-top: 8px; font-size: 10.5px; line-height: 1.65; color: var(--muted); }
.visual-caption::before { content: "◌ "; color: var(--jade); opacity: .65; }
.memory-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
.mem-cell { background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
.mem-cell span { display: block; font-size: 8.5px; color: var(--faint); letter-spacing: .08em; }
.mem-cell b { display: block; font-family: var(--serif); font-size: 18px; font-weight: 600; margin-top: 3px; }
.mem-cell b small { font-family: var(--sans); font-size: 9px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.detail-curve { margin-top: 16px; }
.detail-curve svg { width: 100%; height: auto; }
.note-editor { display: flex; gap: 8px; margin-top: 8px; }
.note-editor input { flex: 1; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 11px; font-size: 11px; outline: 0; }
.note-editor input:focus { border-color: var(--jade); }

/* ---------- study ---------- */
.study-screen { position: fixed; inset: 0; z-index: 70; background: var(--paper); display: flex; flex-direction: column; overflow: hidden; animation: fadeIn .22s ease; }
.study-screen::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(700px 420px at 50% -10%, var(--jade-wash), transparent 65%); }
.study-top { height: 68px; padding: 0 clamp(18px, 4vw, 40px); display: flex; align-items: center; gap: 18px; border-bottom: 1px solid var(--line); position: relative; z-index: 2; background: color-mix(in srgb, var(--paper) 86%, transparent); backdrop-filter: blur(10px); }
.study-top .icon-btn { border: 1px solid var(--line); background: var(--surface); width: 34px; height: 34px; }
.study-progress { flex: 1; max-width: 520px; margin: 0 auto; }
.study-progress-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-bottom: 5px; }
.study-progress-meta b { color: var(--ink); font-weight: 650; }
.study-progress-track { height: 4px; border-radius: 4px; background: var(--paper-deep); overflow: hidden; }
.study-progress-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--jade), #6ca58f); transition: width .35s var(--ease); }
.study-count { font-family: var(--mono); font-size: 10px; color: var(--faint); min-width: 74px; text-align: right; }
.study-main { flex: 1; min-height: 0; overflow-y: auto; padding: 26px 20px 138px; position: relative; z-index: 2; display: flex; flex-direction: column; }
.study-card-wrap { width: min(760px, 100%); margin: auto; }
.study-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl);
  box-shadow: var(--shadow-m); padding: clamp(26px, 5vw, 46px);
  min-height: 370px; display: flex; flex-direction: column;
  position: relative; overflow: hidden;
  animation: cardIn .35s var(--ease);
}
.study-card::after { content: ""; position: absolute; width: 220px; height: 220px; right: -110px; top: -120px; border-radius: 50%; border: 1px solid var(--line); box-shadow: 0 0 0 32px color-mix(in srgb, var(--jade) 3%, transparent), 0 0 0 64px color-mix(in srgb, var(--jade) 2%, transparent); pointer-events: none; }
.study-card-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.study-tag { font-size: 9px; letter-spacing: .16em; font-weight: 700; color: var(--jade); text-transform: uppercase; }
.study-tag.review { color: var(--amber); }
.study-tag.relearn { color: var(--cinnabar); }
.study-hint-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: var(--faint); border: 1px dashed var(--line-strong); padding: 4px 9px; border-radius: 20px; }
.study-hint-btn:hover { color: var(--jade); border-color: var(--jade); }
.study-hint-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
.study-visual { margin-top: 16px; padding: 10px 13px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); display: flex; align-items: center; gap: 13px; }
.study-visual .visual-frame { border-radius: 12px; }
.study-visual-cap { font-size: 10px; line-height: 1.6; color: var(--muted); }
.study-visual-cap::before { content: "◌ "; color: var(--jade); opacity: .65; }
.study-hint-btn .ico { width: 12px; height: 12px; }
.study-word { font-family: var(--serif); font-size: clamp(44px, 7vw, 68px); line-height: 1.05; letter-spacing: -.015em; font-weight: 600; margin-top: 26px; word-break: break-word; }
.study-phone-row { display: flex; align-items: center; gap: 9px; margin-top: 10px; }
.study-phone { font-family: var(--mono); font-size: 12px; color: var(--faint); letter-spacing: .02em; }
.speak-btn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--jade); background: var(--jade-wash); transition: .15s; }
.speak-btn:hover { background: var(--jade); color: var(--surface); }
.speak-btn .ico { width: 14px; height: 14px; }
.study-front-note { margin-top: 28px; padding-top: 20px; border-top: 1px dashed var(--line); font-size: 11.5px; color: var(--faint); display: flex; align-items: center; gap: 8px; }
.study-front-note .ico { width: 14px; height: 14px; }
.study-reveal-hint { margin-top: auto; padding-top: 30px; display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 10.5px; }
.key { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 19px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line-strong); background: var(--surface-2); font-family: var(--mono); font-size: 9px; color: var(--muted); box-shadow: 0 1px 0 var(--line); }
.study-back { animation: revealIn .3s var(--ease); }
.study-defs { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
.study-def { font-size: 16px; line-height: 1.7; color: var(--ink-soft); padding-left: 16px; position: relative; }
.study-def::before { content: ""; position: absolute; left: 0; top: 10px; width: 5px; height: 5px; border-radius: 50%; background: var(--jade); opacity: .55; }
.study-def .pos { color: var(--jade); font-size: 10px; font-family: var(--mono); margin-right: 5px; }
.study-ex { margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.study-ex-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 8.5px; letter-spacing: .16em; color: var(--faint); font-weight: 650; text-transform: uppercase; margin-bottom: 5px; }
.study-ex-en { font-family: var(--serif); font-size: 15px; line-height: 1.65; color: var(--ink-soft); }
.study-ex-en em { font-style: normal; color: var(--jade); border-bottom: 1px solid color-mix(in srgb, var(--jade) 40%, transparent); }
.study-ex-zh { font-size: 10.5px; color: var(--muted); margin-top: 4px; }
.study-mn { margin-top: 14px; display: flex; gap: 9px; font-size: 11px; color: var(--muted); line-height: 1.7; }
.study-mn .mn-mark { font-family: var(--serif); font-size: 16px; color: var(--jade); opacity: .55; flex: none; line-height: 1.2; }
.study-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 9.5px; color: var(--faint); }
.study-meta b { color: var(--muted); font-weight: 600; }
.rating-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
  padding: 14px clamp(18px, 4vw, 40px) max(16px, env(safe-area-inset-bottom));
  background: linear-gradient(0deg, var(--paper) 62%, color-mix(in srgb, var(--paper) 0%, transparent));
  display: flex; justify-content: center;
}
.rating-inner { width: min(760px, 100%); }
.rating-title { text-align: center; font-size: 9.5px; color: var(--faint); letter-spacing: .08em; margin-bottom: 9px; }
.rating-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.rate-btn {
  height: 58px; border-radius: 13px; border: 1px solid var(--line);
  background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  transition: transform .15s var(--ease), box-shadow .15s var(--ease), border-color .15s var(--ease);
  position: relative;
}
.rate-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-s); }
.rate-btn b { font-size: 13px; font-weight: 650; }
.rate-btn small { font-size: 9px; color: var(--faint); font-family: var(--mono); }
.rate-btn .key { position: absolute; top: 7px; right: 8px; min-width: 15px; height: 14px; font-size: 7px; opacity: .7; }
.rate-again:hover { border-color: var(--cinnabar); background: color-mix(in srgb, var(--cinnabar-soft) 35%, var(--surface)); }
.rate-again b { color: var(--cinnabar); }
.rate-hard:hover { border-color: var(--amber); background: color-mix(in srgb, var(--amber-soft) 35%, var(--surface)); }
.rate-hard b { color: var(--amber); }
.rate-good:hover { border-color: var(--jade); background: var(--jade-wash); }
.rate-good b { color: var(--jade); }
.rating-skip { text-align: center; margin-top: 9px; }
.rating-skip button { font-size: 10px; color: var(--faint); }
.rating-skip button:hover { color: var(--muted); text-decoration: underline; }

/* session summary */
.summary-wrap { width: min(680px, 100%); margin: 34px auto 0; text-align: center; }
.summary-mark { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 18px; display: grid; place-items: center; background: var(--jade); color: #f5f1e7; box-shadow: 0 12px 30px rgba(47,111,94,.25); }
.summary-mark .ico { width: 28px; height: 28px; }
.summary-wrap h1 { font-family: var(--serif); font-size: clamp(30px, 5vw, 44px); font-weight: 600; }
.summary-wrap > p { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
.summary-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-top: 26px; text-align: left; }
.summary-stat { padding: 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.summary-stat span { font-size: 9px; color: var(--faint); display: block; }
.summary-stat b { font-family: var(--serif); font-size: 22px; display: block; margin-top: 4px; font-weight: 600; }
.summary-next { margin-top: 18px; padding: 17px 19px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: left; }
.summary-next h3 { font-size: 10px; letter-spacing: .12em; color: var(--faint); text-transform: uppercase; }
.summary-next p { font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; }
.summary-next b { color: var(--jade); }
.summary-actions { display: flex; gap: 9px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }

/* ---------- toast / confetti ---------- */
.toast-root { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; gap: 7px; align-items: center; pointer-events: none; }
.toast { padding: 9px 15px; border-radius: 30px; background: var(--ink); color: var(--paper); font-size: 11px; box-shadow: var(--shadow-m); animation: toastIn .25s var(--ease); white-space: nowrap; }
.toast b { color: #cfe3d8; font-weight: 600; }
.confetti { position: fixed; width: 7px; height: 11px; z-index: 130; pointer-events: none; border-radius: 1px; animation: confettiFall 1.3s ease-out forwards; }

/* ---------- onboarding ---------- */
.onboard { position: fixed; inset: 0; z-index: 100; background: var(--paper); display: flex; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }
.onboard::before { content: ""; position: fixed; inset: 0; background: radial-gradient(900px 500px at 15% 0%, var(--jade-wash), transparent 60%), radial-gradient(700px 500px at 100% 100%, var(--cinnabar-soft), transparent 55%); }
.onboard-card { position: relative; width: min(860px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow-l); overflow: hidden; display: grid; grid-template-columns: .82fr 1.18fr; }
.onboard-art { background: linear-gradient(150deg, #173f35, #2b6353); color: #f4f0e4; padding: 34px 30px; display: flex; flex-direction: column; position: relative; overflow: hidden; min-height: 520px; }
.onboard-art::after { content: ""; position: absolute; width: 260px; height: 260px; border-radius: 50%; border: 1px solid rgba(244,240,228,.16); right: -130px; bottom: -100px; box-shadow: 0 0 0 34px rgba(244,240,228,.03), 0 0 0 68px rgba(244,240,228,.02); }
.onboard-art .brand-mark { background: #f4f0e4; color: #173f35; margin-bottom: 28px; }
.onboard-art h2 { font-family: var(--serif); font-size: 36px; line-height: 1.22; font-weight: 600; margin-top: 8px; }
.onboard-art p { font-size: 11.5px; color: rgba(244,240,228,.62); line-height: 1.85; margin-top: 12px; max-width: 250px; }
.onboard-art .curve-art { margin-top: auto; opacity: .9; }
.onboard-form { padding: 34px 36px 30px; }
.onboard-step { font-size: 9px; letter-spacing: .2em; color: var(--faint); font-weight: 700; }
.onboard-form h3 { font-family: var(--serif); font-size: 26px; font-weight: 600; margin-top: 7px; }
.onboard-form > p { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
.onboard-books { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 18px; }
.onboard-book { text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); transition: .15s; }
.onboard-book:hover { border-color: var(--jade); }
.onboard-book.on { border-color: var(--jade); background: var(--jade-wash); box-shadow: inset 0 0 0 1px var(--jade); }
.onboard-book b { display: block; font-family: var(--serif); font-size: 14px; font-weight: 600; }
.onboard-book span { display: block; font-size: 9px; color: var(--faint); margin-top: 1px; }
.onboard-settings { margin-top: 20px; display: flex; flex-direction: column; gap: 13px; }
.onboard-set { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.onboard-set label { font-size: 11.5px; color: var(--ink-soft); }
.onboard-set label small { display: block; font-size: 9px; color: var(--faint); }
.onboard-set output { font-family: var(--mono); font-size: 12px; color: var(--jade); }
.onboard-note { font-size: 9.5px; color: var(--faint); margin-top: 13px; line-height: 1.6; }
.onboard-actions { display: flex; gap: 9px; margin-top: 22px; }
.onboard-actions .btn { flex: 1; }

/* ---------- misc ---------- */
.fade-in { animation: fadeUp .4s var(--ease) both; }
.delay-1 { animation-delay: .05s; }
.delay-2 { animation-delay: .1s; }
.delay-3 { animation-delay: .15s; }
.divider { height: 1px; background: var(--line); margin: 18px 0; }
.kbd-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.kbd-row .key { height: 21px; font-size: 8px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 10px; border: 3px solid var(--paper); }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  :root { --sidebar-w: 220px; }
  .dash-grid { grid-template-columns: 1fr; }
  .hero-grid { grid-template-columns: 1fr; }
  .side-card { min-height: 210px; }
  .sci-grid { grid-template-columns: 1fr; }
  .sci-two { grid-template-columns: 1fr; }
  .settings-grid { grid-template-columns: 1fr; }
  .memory-grid { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .topbar { height: 64px; padding: 0 18px; }
  .page-date { display: none; }
  .view { padding: 4px 18px 100px; }
  .mobile-nav {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    height: calc(62px + env(safe-area-inset-bottom));
    padding: 7px 8px env(safe-area-inset-bottom);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    border-top: 1px solid var(--line);
    backdrop-filter: blur(16px);
    justify-content: space-around;
  }
  .mnav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--faint); font-size: 9px; min-width: 52px; text-decoration: none; padding: 4px 2px; border-radius: 8px; }
  .mnav-item .ico { width: 20px; height: 20px; }
  .mnav-item.active { color: var(--jade); }
  .mnav-item.active .ico { stroke-width: 2.2; }
  .stat-grid { grid-template-columns: 1fr 1fr; gap: 9px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .hero-card { padding: 24px 22px; }
  .hero-ring { width: 68px; height: 68px; }
  .word-row { grid-template-columns: minmax(120px, 1.1fr) minmax(0, 1.7fr) 86px 22px; }
  .word-head > :nth-child(3), .word-row > :nth-child(3) { display: none; }
  .word-head > :nth-child(4), .word-row > :nth-child(4) { display: none; }
  .word-row { padding: 11px 13px; gap: 9px; }
  .onboard-card { grid-template-columns: 1fr; }
  .onboard-art { display: none; }
  .onboard-form { padding: 28px 24px 24px; }
  .modal-backdrop { padding: 10px; align-items: flex-end; }
  .modal { max-height: 92vh; border-radius: 20px 20px 0 0; }
  .memory-strip { grid-template-columns: 1fr 1fr; }
  .study-top { height: 60px; gap: 10px; padding: 0 14px; }
  .study-count { display: none; }
  .study-main { padding: 16px 14px 120px; }
  .study-card { padding: 24px 20px; min-height: 350px; }
  .study-word { margin-top: 20px; }
  .rating-bar { padding: 10px 12px max(12px, env(safe-area-inset-bottom)); }
  .rate-btn { height: 54px; }
  .summary-stats { grid-template-columns: 1fr 1fr; }
  .sci-hero { padding: 24px; }
  .heatmap { grid-template-rows: repeat(7, 11px); gap: 3px; }
  .heat-cell { width: 11px; height: 11px; }
}
@media (max-width: 560px) {
  .greeting { margin-top: 8px; }
  .greeting h1 { font-size: 28px; }
  .greeting p { font-size: 12px; }
  .hero-grid { gap: 10px; }
  .hero-card { border-radius: 22px; }

  /* ---------- dates ---------- */
  function dayKey(ts) {
    const d = ts == null ? new Date() : new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function dateOfKey(k) { const p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function startOfDay(ts) { const d = new Date(ts == null ? Date.now() : ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function today() { return dayKey(); }
  function weekdayCN(d) { return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()]; }
  function fullDate(d) { return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
  function fmtDate(ts) { const d = new Date(ts); return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()); }
  function dayStat(ts) {
    const k = dayKey(ts);
    if (!state.stats.days[k]) state.stats.days[k] = { total: 0, new: 0, g1: 0, g2: 0, g3: 0, ms: 0 };
    return state.stats.days[k];
  }
  function todayStat() { return dayStat(Date.now()); }
  function newToday() { return todayStat().new || 0; }
  function reviewedToday() { return todayStat().total || 0; }
  function ensureGoal(n) {
    const ds = todayStat();
    if (n > 0) ds.goal = Math.max(ds.goal || 0, n);
    return ds.goal || 0;
  }

  function streakInfo() {
    const keys = Object.keys(state.stats.days).filter((k) => (state.stats.days[k].total || 0) > 0).sort();
    const set = new Set(keys);
    let cur = 0;
    let d = new Date();
    if (!set.has(dayKey(d))) d = addDays(d, -1);
    while (set.has(dayKey(d))) { cur++; d = addDays(d, -1); }
    let best = 0, run = 0, prev = null;
    keys.forEach(function (k) {
      const dt = dateOfKey(k);
      if (prev && Math.round((dt - prev) / DAY) === 1) run++; else run = 1;
      best = Math.max(best, run);
      prev = dt;
    });
    return { current: cur, best: Math.max(best, cur), days: keys.length };
  }

  /* ---------- cards / words ---------- */
  function activeBook() { return bookMap[state.settings.bookId] || BOOKS[0]; }
  function wordOf(key, bookId) {
    const b = bookId || state.settings.bookId;
    return (wordIndex[b] && wordIndex[b].get(String(key).toLowerCase())) || anyWord.get(String(key).toLowerCase()) || { w: key, p: '', t: ['（词条数据缺失）'] };

  function cardOf(key) { return state.cards[String(key).toLowerCase()] || null; }

    const k = String(key).toLowerCase();
    if (!state.cards[k]) state.cards[k] = E.newCard(k, now || Date.now());
    return state.cards[k];
  }
  function allCards() { return Object.keys(state.cards).map(function (k) { return state.cards[k]; }); }
  function learnedCards() { return allCards().filter(function (c) { return c.reps > 0; }); }
  function dueCards(now) {
    return allCards().filter(function (c) { return c.reps > 0 && c.dueAt <= now; })
      .sort(function (a, b) { return a.dueAt - b.dueAt || a.stability - b.stability; });
  }
  function bookLearned(book) {
    let n = 0;
    book.words.forEach(function (w) { const c = cardOf(w.w); if (c && c.reps > 0) n++; });
    return n;
  }
  function bookDue(book, now) {
    let n = 0;
    book.words.forEach(function (w) { const c = cardOf(w.w); if (c && c.reps > 0 && c.dueAt <= now) n++; });
    return n;
  }
  function bookUnlearned(book) {
    return book.words.filter(function (w) { const c = cardOf(w.w); return !c || c.reps === 0; })
      .sort(function (a, b) {
        const ca = CURATED[a.w.toLowerCase()] ? 0 : 1;
        const cb = CURATED[b.w.toLowerCase()] ? 0 : 1;
        if (ca !== cb) return ca - cb;
        return a.w.length - b.w.length || a.w.localeCompare(b.w);
      });
  }

  function plan(now) {
    now = now || Date.now();
    const book = activeBook();
    const due = dueCards(now);
    const batch = Math.max(10, state.settings.dailyTotal);
    const dueBatch = due.slice(0, batch);
    const allowance = Math.max(0, state.settings.dailyNew - newToday());
    const newPool = bookUnlearned(book);
    const room = Math.max(0, batch - dueBatch.length);
    const newWords = newPool.slice(0, Math.min(allowance, room));
    return { due: due, dueBatch: dueBatch, newWords: newWords, total: dueBatch.length + newWords.length, book: book };
  }

  /* ---------- labels ---------- */
  function dueLabel(ts, now) {
    now = now || Date.now();
    if (!ts) return '—';
    const diff = ts - now;
    if (diff <= 0) return '现在';
    if (diff < 3600000) return Math.max(1, Math.round(diff / 60000)) + ' 分钟后';
    if (diff < DAY) return Math.round(diff / 3600000) + ' 小时后';
    const days = Math.round(diff / DAY);
    if (days < 30) return days + ' 天后';
    const d = new Date(ts);

  /* ---------- svg helpers ---------- */
  let gradSeq = 0;
  function smoothPath(pts) {
    if (!pts.length) return '';
    if (pts.length === 1) return 'M' + pts[0][0] + ',' + pts[0][1];
    let d = 'M' + pts[0][0].toFixed(2) + ',' + pts[0][1].toFixed(2);
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += 'C' + c1x.toFixed(2) + ',' + c1y.toFixed(2) + ' ' + c2x.toFixed(2) + ',' + c2y.toFixed(2) + ' ' + p2[0].toFixed(2) + ',' + p2[1].toFixed(2);
    }
    return d;
  }
  function curveChart(points, opts) {
    opts = opts || {};
    const W = 720, H = opts.height || 250, L = 40, R = 16, T = 18, B = 30;
    const yMin = opts.yMin || 0.5, yMax = 1;
    const xs = points.map(function (p) { return p[0]; });
    const xMax = Math.max.apply(null, xs) || 1;
    const px = function (x) { return L + (x / xMax) * (W - L - R); };
    const py = function (y) { return T + (1 - (y - yMin) / (yMax - yMin)) * (H - T - B); };
    const xy = points.map(function (p) { return [px(p[0]), py(p[1])]; });
    const line = smoothPath(xy);
    const area = line + 'L' + px(xMax) + ',' + (H - B) + 'L' + px(0) + ',' + (H - B) + 'Z';
    const id = 'g' + (++gradSeq);
    let grid = '';

  function perWordCurve(card, days) {
    days = days || 30;
    const now = Date.now();
    const s = card && card.reps ? card.stability : 2.5;
    const elapsed = card && card.reps ? Math.max(0, (now - card.lastReview) / DAY) : 0;
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const t = days * i / 40;
      pts.push([t, E.retrievability(elapsed + t, s)]);
    }
    return pts;
  }
  function aggregateCurve(cards, days) {
    days = days || 30;
    if (!cards.length) {
      const pts = [];
      for (let i = 0; i <= 40; i++) { const t = days * i / 40; pts.push([t, E.retrievability(t, 5)]); }
      return pts;
    }
    const now = Date.now();
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const t = days * i / 40;
      let sum = 0;
      cards.forEach(function (c) {
        const elapsed = Math.max(0, (now - c.lastReview) / DAY);
        sum += E.retrievability(elapsed + t, c.stability);
      });
      pts.push([t, sum / cards.length]);
    }
    return pts;
  }
